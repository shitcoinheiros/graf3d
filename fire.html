<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Realm - Experiência Imersiva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1a;
            color: white;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Tela inicial - Luxuosa e sofisticada */
        #home-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 100% 0%, #1a1f2e, #0a0f1a);
            z-index: 1000;
            overflow-y: auto;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
        }

        #home-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #f7931a;
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .coin-list {
            max-width: 800px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0 20px;
        }

        .coin-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 24px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .coin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #f7931a, #9945FF, transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .coin-card:hover::before {
            opacity: 1;
        }

        .coin-card:active {
            transform: scale(0.99);
            background: rgba(255,255,255,0.03);
        }

        .coin-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .coin-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btc-icon { background: #f7931a; }
        .siren-icon { background: #00ffff; box-shadow: 0 10px 20px rgba(0,255,255,0.2); }
        .pippin-icon { background: #ff69b4; }
        .tria-icon { background: #8b5cf6; }

        .coin-info {
            flex: 1;
        }

        .coin-name {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .coin-symbol {
            color: #94a3b8;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .coin-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .coin-price {
            font-size: 24px;
            font-weight: 300;
        }

        .coin-change {
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 30px;
            background: rgba(255,255,255,0.03);
        }

        .positive { color: #22c55e; }
        .negative { color: #ef4444; }

        .enter-text {
            position: absolute;
            bottom: 25px;
            right: 25px;
            color: #94a3b8;
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .coin-card:hover .enter-text {
            opacity: 0.5;
        }

        /* Tela do mundo - Design minimalista e realista */
        #world-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: none;
        }

        #world-screen.active {
            display: block;
        }

        /* HUD Superior - Informações essenciais */
        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 2100;
            background: rgba(10,15,26,0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 100px;
            padding: 8px 20px 8px 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        #world-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        #coin-info-compact {
            line-height: 1.4;
        }

        #world-coin-name {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        #world-coin-symbol {
            font-size: 11px;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }

        /* Preço em destaque */
        #price-container {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 2100;
            background: rgba(10,15,26,0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 100px;
            padding: 8px 25px;
            text-align: right;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        #price-value {
            font-size: 18px;
            font-weight: 300;
            color: #f7931a;
            letter-spacing: 0.5px;
        }

        #price-change {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* ===== CONTROLES REALISTAS ===== */
        /* Design minimalista, botões pequenos e elegantes */

        /* Área de movimento - Toque duplo sutil */
        #move-area {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 80px;
            height: 80px;
            z-index: 2100;
            opacity: 0.3;
            transition: opacity 0.3s;
            pointer-events: auto;
        }

        #move-area.active {
            opacity: 0.8;
        }

        .move-ring {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            position: relative;
            background: rgba(10,15,26,0.2);
            backdrop-filter: blur(5px);
        }

        .move-dot {
            width: 20px;
            height: 20px;
            background: rgba(247,147,26,0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(247,147,26,0.3);
            transition: all 0.1s;
        }

        /* Indicadores direcionais sutis */
        .direction-hint {
            position: absolute;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            transition: color 0.2s;
        }

        .hint-up { top: 5px; left: 50%; transform: translateX(-50%); }
        .hint-down { bottom: 5px; left: 50%; transform: translateX(-50%); }
        .hint-left { left: 5px; top: 50%; transform: translateY(-50%); }
        .hint-right { right: 5px; top: 50%; transform: translateY(-50%); }

        #move-area.active .direction-hint {
            color: rgba(247,147,26,0.6);
        }

        /* Área de olhar - Toque duplo sutil */
        #look-area {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 70px;
            height: 70px;
            z-index: 2100;
            opacity: 0.3;
            transition: opacity 0.3s;
            pointer-events: auto;
        }

        #look-area.active {
            opacity: 0.8;
        }

        .look-ring {
            width: 100%;
            height: 100%;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            position: relative;
            background: rgba(10,15,26,0.2);
            backdrop-filter: blur(5px);
        }

        .look-dot {
            width: 16px;
            height: 16px;
            background: rgba(153,69,255,0.8);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px rgba(153,69,255,0.3);
            transition: all 0.1s;
        }

        /* Botões de ação - Ícones minimalistas */
        #action-controls {
            position: absolute;
            bottom: 40px;
            right: 140px;
            display: flex;
            gap: 15px;
            z-index: 2100;
            pointer-events: auto;
        }

        .action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(10,15,26,0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
            color: rgba(255,255,255,0.6);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .action-btn:active {
            background: rgba(255,255,255,0.05);
            color: white;
            border-color: rgba(255,255,255,0.2);
            transform: scale(0.95);
        }

        #jump-btn:active { color: #22c55e; border-color: #22c55e; }
        #run-btn.active { color: #f7931a; border-color: #f7931a; background: rgba(247,147,26,0.1); }
        #crouch-btn:active { color: #8b5cf6; border-color: #8b5cf6; }

        /* Mini-mapa - Elegante e discreto */
        #minimap {
            position: absolute;
            top: 100px;
            left: 30px;
            width: 120px;
            height: 120px;
            border-radius: 20px;
            background: rgba(10,15,26,0.3);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.03);
            z-index: 2100;
            overflow: hidden;
            opacity: 0.5;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        #minimap:hover {
            opacity: 0.8;
        }

        #minimap-canvas {
            width: 100%;
            height: 100%;
        }

        /* Botão sair - Discreto */
        #exit-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            color: rgba(239,68,68,0.6);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2100;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            pointer-events: auto;
        }

        #exit-btn:active {
            background: rgba(239,68,68,0.2);
            color: #ef4444;
            border-color: #ef4444;
        }

        /* Loading */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            z-index: 2200;
            background: rgba(10,15,26,0.8);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.05);
            letter-spacing: 1px;
        }

        /* Dica inicial - Discreta */
        #hint {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            z-index: 2100;
            background: rgba(10,15,26,0.3);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.03);
            letter-spacing: 0.5px;
            pointer-events: none;
            animation: fadeOut 3s forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Tela inicial -->
    <div id="home-screen">
        <div class="header">
            <div class="logo">CRYPTO REALM</div>
            <div class="subtitle">EXPERIÊNCIA IMERSIVA</div>
        </div>

        <div class="coin-list">
            <!-- Bitcoin -->
            <div class="coin-card" onclick="enterWorld('btc')">
                <div class="coin-header">

                    <div class="coin-info">
                        <div class="coin-name">Bitcoin</div>

                    </div>
                </div>
                <div class="coin-stats">
                    <span class="coin-price">$67,890</span>

            <!-- Siren -->
            <div class="coin-card" onclick="enterWorld('siren')">
                <div class="coin-header">
                    <div class="coin-icon siren-icon">🧜‍♀️</div>
                    <div class="coin-info">
                        <div class="coin-name">Siren</div>
                        <div class="coin-symbol">SIREN</div>
                    </div>
                </div>
                <div class="coin-stats">
                    <span class="coin-price">$0.89</span>
                    <span class="coin-change positive">+15.67%</span>
                </div>
                <span class="enter-text">ENTRAR →</span>
            </div>

            <!-- Pippin -->
            <div class="coin-card" onclick="enterWorld('pippin')">
                <div class="coin-header">
                    <div class="coin-icon pippin-icon">🐧</div>
                    <div class="coin-info">
                        <div class="coin-name">Pippin</div>
                        <div class="coin-symbol">PIPPIN</div>
                    </div>
                </div>
                <div class="coin-stats">
                    <span class="coin-price">$0.0023</span>

            <!-- Tria -->
            <div class="coin-card" onclick="enterWorld('tria')">
                <div class="coin-header">
                    <div class="coin-icon tria-icon">🔺</div>
                    <div class="coin-info">
                        <div class="coin-name">Tria</div>
                        <div class="coin-symbol">TRIA</div>
                    </div>
                </div>
                <div class="coin-stats">
                    <span class="coin-price">$12.45</span>
                    <span class="coin-change positive">+5.23%</span>
                </div>
                <span class="enter-text">ENTRAR →</span>
            </div>
        </div>
    </div>

    <!-- Tela do mundo -->
    <div id="world-screen">
        <!-- HUD Superior -->
        <div id="hud">
            <div id="world-icon">₿</div>
            <div id="coin-info-compact">
                <div id="world-coin-name">Bitcoin</div>
                <div id="world-coin-symbol">BTC</div>
            </div>
        </div>

        <div id="price-container">
            <div id="price-value">$67,890</div>
            <div id="price-change">+2.34%</div>
        </div>

        <!-- Mini-mapa -->
        <div id="minimap">
            <canvas id="minimap-canvas" width="120" height="120"></canvas>
        </div>

        <!-- Controles minimalistas -->
        <div id="move-area">
            <div class="move-ring">
                <div class="move-dot" id="move-dot"></div>
                <span class="direction-hint hint-up">▲</span>
                <span class="direction-hint hint-down">▼</span>
                <span class="direction-hint hint-left">◀</span>
                <span class="direction-hint hint-right">▶</span>
            </div>
        </div>

        <div id="look-area">
            <div class="look-ring">
                <div class="look-dot" id="look-dot"></div>
            </div>
        </div>

        <div id="action-controls">
            <button class="action-btn" id="jump-btn">↑</button>
            <button class="action-btn" id="run-btn">→</button>
            <button class="action-btn" id="crouch-btn">↓</button>
        </div>

        <button id="exit-btn">✕</button>
        <div id="loading">CARREGANDO MUNDO</div>
        <div id="hint">TOQUE DUPLO NOS CÍRCULOS PARA ANDAR E OLHAR</div>
    </div>

    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // Configuração das moedas
        const COINS = {
            btc: { name: 'Bitcoin', symbol: 'BTC', binance: 'BTCUSDT', icon: '₿', color: '#f7931a', bgColor: 0xf7931a },
            siren: { name: 'Siren', symbol: 'SIREN', binance: 'SIRENUSDT', icon: '🧜‍♀️', color: '#00ffff', bgColor: 0x00ffff },
            pippin: { name: 'Pippin', symbol: 'PIPPIN', binance: 'PIPPINUSDT', icon: '🐧', color: '#ff69b4', bgColor: 0xff69b4 },
            tria: { name: 'Tria', symbol: 'TRIA', binance: 'TRIAUSDT', icon: '🔺', color: '#8b5cf6', bgColor: 0x8b5cf6 }
        };

        let currentCoin = 'btc';
        let scene, camera, renderer, labelRenderer;
        let player = {
            height: 2,
            speed: 0.15,
            position: new THREE.Vector3(0, 2, 10),
            rotation: new THREE.Euler(0, 0, 0),
            isRunning: false,
            isCrouching: false
        };
        
        // Elementos do gráfico
        let candleGroup, bollingerGroup, smokeGroup;
        let historicalCandles = [];
        let liveCandleMesh = null;
        let liveSmokeParticles = [];
        let liveCandleData = null;
        let minPrice, maxPrice, minVolume, maxVolume;
        let lastPrice = 67000;
        let binanceSocket = null;
        let dataLoaded = false;
        
        // Controles realistas
        let moveControl = { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0 };
        let lookControl = { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0 };
        let moveSpeed = 0.15;
        let lookSpeed = 0.01;
        
        // Parâmetros visuais
        const WICK_RADIUS = 0.1;
        const SPACING = 2.0;
        const Y_RANGE = 20;
        const GROUND_Y = 0;
        const BB_PERIOD = 20;
        const BB_STD = 2;
        const MIN_RADIUS = 0.3;
        const MAX_RADIUS = 1.0;

        const TIMEFRAMES = { '1m': { binance: '1m', limit: 30, ms: 60 * 1000 } };

        // Elementos DOM
        const homeScreen = document.getElementById('home-screen');
        const worldScreen = document.getElementById('world-screen');
        const loadingEl = document.getElementById('loading');
        const worldIcon = document.getElementById('world-icon');
        const worldCoinName = document.getElementById('world-coin-name');
        const worldCoinSymbol = document.getElementById('world-coin-symbol');
        const priceValue = document.getElementById('price-value');
        const priceChange = document.getElementById('price-change');
        
        // Elementos de controle
        const moveArea = document.getElementById('move-area');
        const lookArea = document.getElementById('look-area');
        const moveDot = document.getElementById('move-dot');
        const lookDot = document.getElementById('look-dot');
        const runBtn = document.getElementById('run-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const crouchBtn = document.getElementById('crouch-btn');
        const exitBtn = document.getElementById('exit-btn');
        const hint = document.getElementById('hint');

        // Funções globais
        window.enterWorld = (coin) => {
            currentCoin = coin;
            const coinData = COINS[coin];
            
            worldIcon.innerHTML = coinData.icon;
            worldIcon.style.background = coinData.color;
            worldCoinName.textContent = coinData.name;
            worldCoinSymbol.textContent = coinData.symbol;
            
            homeScreen.classList.add('hidden');
            worldScreen.classList.add('active');
            
            setTimeout(() => {
                if (hint) hint.style.display = 'none';
            }, 3000);
            
            initWorld();
        };

        window.exitWorld = () => {
            worldScreen.classList.remove('active');
            homeScreen.classList.remove('hidden');
            
            if (binanceSocket) binanceSocket.close();
            if (renderer) {
                renderer.dispose();
                renderer = null;
            }
        };

        // Configurar controles realistas
        function setupControls() {
            // Controle de movimento - toque e arrasto
            moveArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = moveArea.getBoundingClientRect();
                
                moveControl.active = true;
                moveControl.startX = rect.left + rect.width/2;
                moveControl.startY = rect.top + rect.height/2;
                moveControl.currentX = 0;
                moveControl.currentY = 0;
                
                moveArea.classList.add('active');
            });

            moveArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!moveControl.active) return;
                
                const touch = e.touches[0];
                const dx = (touch.clientX - moveControl.startX) / 30;
                const dy = (touch.clientY - moveControl.startY) / 30;
                
                // Limitar distância
                const distance = Math.sqrt(dx*dx + dy*dy);
                if (distance > 1) {
                    moveControl.currentX = dx / distance;
                    moveControl.currentY = dy / distance;
                } else {
                    moveControl.currentX = dx;
                    moveControl.currentY = dy;
                }
                
                // Mover o dot visualmente
                moveDot.style.transform = `translate(calc(-50% + ${moveControl.currentX * 20}px), calc(-50% + ${moveControl.currentY * 20}px))`;
            });

            moveArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                moveControl.active = false;
                moveControl.currentX = 0;
                moveControl.currentY = 0;
                moveArea.classList.remove('active');
                moveDot.style.transform = 'translate(-50%, -50%)';
            });

            // Controle de olhar - toque e arrasto
            lookArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                const rect = lookArea.getBoundingClientRect();
                
                lookControl.active = true;
                lookControl.startX = rect.left + rect.width/2;
                lookControl.startY = rect.top + rect.height/2;
                lookControl.currentX = 0;
                lookControl.currentY = 0;
                
                lookArea.classList.add('active');
            });

            lookArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!lookControl.active) return;
                
                const touch = e.touches[0];
                const dx = (touch.clientX - lookControl.startX) / 30;
                const dy = (touch.clientY - lookControl.startY) / 30;
                
                const distance = Math.sqrt(dx*dx + dy*dy);
                if (distance > 1) {
                    lookControl.currentX = dx / distance;
                    lookControl.currentY = dy / distance;
                } else {
                    lookControl.currentX = dx;
                    lookControl.currentY = dy;
                }
                
                lookDot.style.transform = `translate(calc(-50% + ${lookControl.currentX * 15}px), calc(-50% + ${lookControl.currentY * 15}px))`;
            });

            lookArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                lookControl.active = false;
                lookControl.currentX = 0;
                lookControl.currentY = 0;
                lookArea.classList.remove('active');
                lookDot.style.transform = 'translate(-50%, -50%)';
            });

            // Botões de ação
            jumpBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                jump();
            });

            runBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                toggleRun();
            });

            crouchBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                toggleCrouch();
            });

            exitBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                exitWorld();
            });
        }

        function jump() {
            if (player.position.y <= 2.1) {
                player.position.y = 3;
                setTimeout(() => {
                    player.position.y = player.isCrouching ? 1.2 : 2;
                }, 300);
            }
        }

        function toggleRun() {
            player.isRunning = !player.isRunning;
            moveSpeed = player.isRunning ? 0.3 : 0.15;
            runBtn.classList.toggle('active');
        }

        function toggleCrouch() {
            player.isCrouching = !player.isCrouching;
            player.position.y = player.isCrouching ? 1.2 : 2;
            crouchBtn.classList.toggle('active');
        }

        async function initWorld() {
            loadingEl.style.display = 'block';
            
            const container = document.getElementById('world-screen');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0f1a);
            scene.fog = new THREE.Fog(0x0a0f1a, 30, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.copy(player.position);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0px';
            labelRenderer.domElement.style.left = '0px';
            labelRenderer.domElement.style.pointerEvents = 'none';
            container.appendChild(labelRenderer.domElement);

            // Luzes
            const ambientLight = new THREE.AmbientLight(0x404060);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(20, 40, 20);
            dirLight.castShadow = true;
            scene.add(dirLight);

            createWorld();
            await fetchHistoricalData();
            
            loadingEl.style.display = 'none';
            animate();
        }

        function createWorld() {
            const coinData = COINS[currentCoin];
            
            // Chão com grid elegante
            const gridHelper = new THREE.GridHelper(100, 50, coinData.bgColor, 0x2d3748);
            gridHelper.position.y = GROUND_Y;
            scene.add(gridHelper);

            // Textura sofisticada do chão
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = '#0a0f1a';
            ctx.fillRect(0, 0, 1024, 1024);
            
            ctx.fillStyle = `rgba(${parseInt(coinData.color.slice(1,3), 16)}, ${parseInt(coinData.color.slice(3,5), 16)}, ${parseInt(coinData.color.slice(5,7), 16)}, 0.05)`;
            ctx.font = 'bold 100px "Inter", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for(let i = 0; i < 10; i++) {
                for(let j = 0; j < 10; j++) {
                    ctx.fillText(coinData.symbol, 100 + i*200, 100 + j*200);
                }
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                map: texture, 
                roughness: 0.7,
                metalness: 0.1
            });
            
            const groundGeometry = new THREE.PlaneGeometry(100, 100);
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = GROUND_Y + 0.01;
            ground.receiveShadow = true;
            scene.add(ground);

            // Grupo do gráfico
            candleGroup = new THREE.Group();
            bollingerGroup = new THREE.Group();
            smokeGroup = new THREE.Group();
            
            candleGroup.position.set(0, 0, -20);
            bollingerGroup.position.set(0, 0, -20);
            smokeGroup.position.set(0, 0, -20);
            
            scene.add(candleGroup);
            scene.add(bollingerGroup);
            scene.add(smokeGroup);

            // Label do mundo
            const labelDiv = document.createElement('div');
            labelDiv.textContent = coinData.name;
            labelDiv.style.color = coinData.color;
            labelDiv.style.fontSize = '14px';
            labelDiv.style.fontWeight = '300';
            labelDiv.style.letterSpacing = '2px';
            labelDiv.style.background = 'rgba(10,15,26,0.4)';
            labelDiv.style.backdropFilter = 'blur(10px)';
            labelDiv.style.padding = '6px 20px';
            labelDiv.style.borderRadius = '30px';
            labelDiv.style.border = '1px solid rgba(255,255,255,0.03)';
            
            const label = new CSS2DObject(labelDiv);
            label.position.set(0, 15, -20);
            scene.add(label);
        }

        // Funções de dados (mantidas do código anterior)
        async function fetchHistoricalData() {
            try {
                const coinData = COINS[currentCoin];
                const tf = TIMEFRAMES['1m'];
                
                let symbol = 'BTCUSDT';
                if (coinData.symbol === 'BTC') symbol = 'BTCUSDT';
                else symbol = coinData.symbol + 'USDT';
                
                const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${tf.binance}&limit=${tf.limit}`;
                
                const response = await fetch(url);
                const data = await response.json();
                
                const formatted = data.map(k => ({
                    time: k[0],
                    open: parseFloat(k[1]),
                    high: parseFloat(k[2]),
                    low: parseFloat(k[3]),
                    close: parseFloat(k[4]),
                    volume: parseFloat(k[5])
                }));
                
                processHistoricalData(formatted);
                connectWebSocket(symbol);
                
            } catch (error) {
                console.error('Erro ao buscar dados:', error);
                generateMockData();
            }
        }

        function processHistoricalData(data) {
            historicalCandles = data.slice(0, -1);
            liveCandleData = { ...data[data.length - 1] };
            lastPrice = liveCandleData.close;
            
            minPrice = Infinity;
            maxPrice = -Infinity;
            minVolume = Infinity;
            maxVolume = -Infinity;
            
            [...historicalCandles, liveCandleData].forEach(c => {
                minPrice = Math.min(minPrice, c.low);
                maxPrice = Math.max(maxPrice, c.high);
                if (c.volume) {
                    minVolume = Math.min(minVolume, c.volume);
                    maxVolume = Math.max(maxVolume, c.volume);
                }
            });
            
            const priceRange = maxPrice - minPrice;
            minPrice -= priceRange * 0.1;
            maxPrice += priceRange * 0.1;
            
            if (minVolume === Infinity || minVolume === maxVolume) {
                minVolume = 100;
                maxVolume = 1000;
            }
            
            dataLoaded = true;
            renderCandles();
            createBollingerBands();
            updatePriceDisplay();
        }

        function generateMockData() {
            const tf = TIMEFRAMES['1m'];
            const data = [];
            let basePrice = lastPrice;
            let time = Date.now() - tf.limit * tf.ms;
            
            for (let i = 0; i < tf.limit; i++) {
                const open = basePrice + (Math.random() - 0.5) * 800;
                const close = open + (Math.random() - 0.5) * 600;
                const high = Math.max(open, close) + Math.random() * 300;
                const low = Math.min(open, close) - Math.random() * 300;
                const volume = Math.random() * 1000 + 200;
                
                data.push({ time: time + i * tf.ms, open, high, low, close, volume });
                basePrice = close;
            }
            
            processHistoricalData(data);
            startSimulatedTrades();
        }

        function connectWebSocket(symbol) {
            if (binanceSocket) binanceSocket.close();
            
            const stream = `${symbol.toLowerCase()}@trade`;
            const wsUrl = `wss://stream.binance.com:9443/ws/${stream}`;
            
            binanceSocket = new WebSocket(wsUrl);
            
            binanceSocket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.e === 'trade') {
                    processNewTrade({
                        price: parseFloat(data.p),
                        time: data.T,
                        volume: parseFloat(data.q)
                    });
                }
            };
            
            binanceSocket.onerror = () => {
                startSimulatedTrades();
            };
        }

        function processNewTrade(trade) {
            if (!liveCandleData || !dataLoaded) return;
            
            const tf = TIMEFRAMES['1m'];
            const periodStart = Math.floor(liveCandleData.time / tf.ms) * tf.ms;
            const tradePeriodStart = Math.floor(trade.time / tf.ms) * tf.ms;
            
            if (tradePeriodStart > periodStart) {
                historicalCandles.push({ ...liveCandleData });
                
                if (historicalCandles.length > tf.limit) {
                    historicalCandles.shift();
                }
                
                liveCandleData = {
                    time: trade.time,
                    open: trade.price,
                    high: trade.price,
                    low: trade.price,
                    close: trade.price,
                    volume: trade.volume || 100
                };
                
                minPrice = Math.min(minPrice, trade.price);
                maxPrice = Math.max(maxPrice, trade.price);
                const priceRange = maxPrice - minPrice;
                minPrice -= priceRange * 0.1;
                maxPrice += priceRange * 0.1;
                
                renderCandles();
                return;
            }
            
            if (liveCandleData.open === 0) liveCandleData.open = trade.price;
            liveCandleData.high = Math.max(liveCandleData.high, trade.price);
            liveCandleData.low = Math.min(liveCandleData.low, trade.price);
            liveCandleData.close = trade.price;
            
            if (trade.volume) {
                liveCandleData.volume = (liveCandleData.volume || 0) + trade.volume;
                if (liveCandleData.volume > maxVolume) {
                    maxVolume = liveCandleData.volume;
                }
            }
            
            lastPrice = trade.price;
            updateLiveCandle();
            updatePriceDisplay();
        }

        function startSimulatedTrades() {
            setInterval(() => {
                if (!liveCandleData || !dataLoaded) return;
                
                const change = (Math.random() - 0.5) * 200;
                const newPrice = Math.max(0.01, lastPrice + change);
                const volume = Math.random() * 200 + 50;
                
                processNewTrade({
                    price: newPrice,
                    time: Date.now(),
                    volume: volume
                });
            }, 800);
        }

        function updatePriceDisplay() {
            if (!liveCandleData) return;
            
            priceValue.textContent = `$${liveCandleData.close.toFixed(2)}`;
            const change = ((liveCandleData.close - liveCandleData.open) / liveCandleData.open * 100).toFixed(2);
            const changeClass = change >= 0 ? '📈' : '📉';
            priceChange.textContent = `${changeClass} ${Math.abs(change)}%`;
            priceChange.style.color = change >= 0 ? '#22c55e' : '#ef4444';
        }

        // Funções 3D
        function mapPriceToY(price) {
            if (maxPrice === minPrice) return 0;
            return ((price - minPrice) / (maxPrice - minPrice)) * Y_RANGE;
        }

        function mapVolumeToRadius(volume) {
            if (maxVolume === minVolume) return (MIN_RADIUS + MAX_RADIUS) / 2;
            const normalized = (volume - minVolume) / (maxVolume - minVolume);
            return MIN_RADIUS + normalized * (MAX_RADIUS - MIN_RADIUS);
        }

        function createBollingerBands() {
            while(bollingerGroup.children.length) {
                bollingerGroup.remove(bollingerGroup.children[0]);
            }
            
            if (historicalCandles.length < BB_PERIOD) return;
            
            const total = historicalCandles.length + 1;
            const points = [];
            
            for (let i = 0; i < total; i++) {
                let candle;
                if (i < historicalCandles.length) {
                    candle = historicalCandles[i];
                } else {
                    candle = liveCandleData;
                }
                
                const allCandles = [...historicalCandles, liveCandleData];
                const startIdx = Math.max(0, i - BB_PERIOD + 1);
                const windowCandles = allCandles.slice(startIdx, i + 1);
                
                if (windowCandles.length >= BB_PERIOD) {
                    const closes = windowCandles.map(c => c.close);
                    const mean = closes.reduce((a, b) => a + b, 0) / BB_PERIOD;
                    const squaredDiffs = closes.map(p => Math.pow(p - mean, 2));
                    const variance = squaredDiffs.reduce((a, b) => a + b, 0) / BB_PERIOD;
                    const stdDev = Math.sqrt(variance);
                    
                    const xPos = (i - total/2) * SPACING;
                    
                    points.push({
                        x: xPos,
                        upper: mapPriceToY(mean + (stdDev * BB_STD)),
                        middle: mapPriceToY(mean),
                        lower: mapPriceToY(mean - (stdDev * BB_STD))
                    });
                }
            }
            
            if (points.length < 2) return;
            
            const upperMaterial = new THREE.LineBasicMaterial({ color: 0x8b5cf6 });
            const middleMaterial = new THREE.LineBasicMaterial({ color: 0x60a5fa });
            const lowerMaterial = new THREE.LineBasicMaterial({ color: 0x8b5cf6 });
            
            const upperPoints = points.map(p => new THREE.Vector3(p.x, p.upper, 0));
            const upperGeo = new THREE.BufferGeometry().setFromPoints(upperPoints);
            const upperLine = new THREE.Line(upperGeo, upperMaterial);
            bollingerGroup.add(upperLine);
            
            const middlePoints = points.map(p => new THREE.Vector3(p.x, p.middle, 0));
            const middleGeo = new THREE.BufferGeometry().setFromPoints(middlePoints);
            const middleLine = new THREE.Line(middleGeo, middleMaterial);
            bollingerGroup.add(middleLine);
            
            const lowerPoints = points.map(p => new THREE.Vector3(p.x, p.lower, 0));
            const lowerGeo = new THREE.BufferGeometry().setFromPoints(lowerPoints);
            const lowerLine = new THREE.Line(lowerGeo, lowerMaterial);
            bollingerGroup.add(lowerLine);
        }

        function createCandle(data, index, total, isLive = false) {
            const { open, high, low, close, volume } = data;
            
            const isGreen = close >= open;
            const bodyColor = isGreen ? 0x22c55e : 0xef4444;
            
            const yOpen = mapPriceToY(open);
            const yClose = mapPriceToY(close);
            const yHigh = mapPriceToY(high);
            const yLow = mapPriceToY(low);
            
            const xPos = (index - total/2) * SPACING;
            const radius = mapVolumeToRadius(volume);
            
            const group = new THREE.Group();
            group.position.set(xPos, 0, 0);
            
            // Corpo
            const bodyHeight = Math.abs(yClose - yOpen) || 0.1;
            const bodyGeo = new THREE.CylinderGeometry(radius, radius, bodyHeight, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: bodyColor,
                roughness: 0.4,
                metalness: 0.3,
                emissive: bodyColor,
                emissiveIntensity: isLive ? 0.6 : 0.1
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = (yOpen + yClose) / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            
            // Pavios
            const wickMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
            
            if (yHigh > Math.max(yOpen, yClose)) {
                const wickHeight = yHigh - Math.max(yOpen, yClose);
                const wickGeo = new THREE.CylinderGeometry(WICK_RADIUS, WICK_RADIUS, wickHeight, 8);
                const wick = new THREE.Mesh(wickGeo, wickMat);
                wick.position.y = Math.max(yOpen, yClose) + wickHeight/2;
                wick.castShadow = true;
                group.add(wick);
            }
            
            if (yLow < Math.min(yOpen, yClose)) {
                const wickHeight = Math.min(yOpen, yClose) - yLow;
                const wickGeo = new THREE.CylinderGeometry(WICK_RADIUS, WICK_RADIUS, wickHeight, 8);
                const wick = new THREE.Mesh(wickGeo, wickMat);
                wick.position.y = Math.min(yOpen, yClose) - wickHeight/2;
                wick.castShadow = true;
                group.add(wick);
            }
            
            if (isLive) {
                group.userData = { body };
            }
            
            return group;
        }

        function createSmokeParticles(color, count = 12) {
            const particles = [];
            const particleGroup = new THREE.Group();
            
            const geometry = new THREE.SphereGeometry(0.15, 5, 5);
            
            for (let i = 0; i < count; i++) {
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.4,
                    transparent: true,
                    opacity: 0.3
                });
                
                const particle = new THREE.Mesh(geometry, material);
                
                const angle = (i / count) * Math.PI * 2;
                const radius = 1.0;
                particle.position.set(
                    Math.cos(angle) * radius,
                    2.0,
                    Math.sin(angle) * radius
                );
                
                particle.userData = {
                    baseY: 2.0,
                    speed: 0.02 + Math.random() * 0.03,
                    angle: angle,
                    radius: radius,
                    phase: Math.random() * Math.PI * 2
                };
                
                particleGroup.add(particle);
                particles.push(particle);
            }
            
            return { group: particleGroup, particles };
        }

        function updateSmoke(particles, candleY, isGreen) {
            if (!particles) return;
            
            const time = Date.now() * 0.003;
            const color = isGreen ? 0x22c55e : 0xef4444;
            
            particles.forEach((particle, i) => {
                const data = particle.userData;
                
                data.angle += 0.02;
                particle.position.x = Math.cos(data.angle + data.phase) * data.radius;
                particle.position.z = Math.sin(data.angle + data.phase) * data.radius;
                particle.position.y = candleY + 1.2 + Math.sin(time + i) * 0.3;
                
                particle.material.opacity = 0.2 + Math.sin(time + i) * 0.1;
                data.radius += 0.001;
                if (data.radius > 1.8) data.radius = 1.0;
                
                particle.material.color.setHex(color);
                particle.material.emissive.setHex(color);
            });
        }

        function updateLiveCandle() {
            if (!liveCandleMesh || !liveCandleData) return;
            
            const { body } = liveCandleMesh.userData;
            const { open, high, low, close, volume } = liveCandleData;
            
            const yOpen = mapPriceToY(open);
            const yClose = mapPriceToY(close);
            
            const isGreen = close >= open;
            const bodyColor = isGreen ? 0x22c55e : 0xef4444;
            
            const bodyHeight = Math.abs(yClose - yOpen) || 0.1;
            const radius = mapVolumeToRadius(volume || 100);
            
            body.scale.x = radius / MIN_RADIUS;
            body.scale.z = radius / MIN_RADIUS;
            body.scale.y = bodyHeight;
            body.position.y = (yOpen + yClose) / 2;
            body.material.color.setHex(bodyColor);
            body.material.emissive.setHex(bodyColor);
            body.material.emissiveIntensity = 0.5 + Math.sin(Date.now() * 0.01) * 0.2;
            
            if (liveSmokeParticles.length > 0) {
                updateSmoke(liveSmokeParticles, (yOpen + yClose) / 2, isGreen);
            }
            
            createBollingerBands();
        }

        function renderCandles() {
            while(candleGroup.children.length) {
                candleGroup.remove(candleGroup.children[0]);
            }
            
            while(smokeGroup.children.length) {
                smokeGroup.remove(smokeGroup.children[0]);
            }
            
            liveSmokeParticles = [];
            
            const total = historicalCandles.length + 1;
            
            historicalCandles.forEach((candle, index) => {
                const staticCandle = createCandle(candle, index, total, false);
                candleGroup.add(staticCandle);
            });
            
            const liveIndex = historicalCandles.length;
            liveCandleMesh = createCandle(liveCandleData, liveIndex, total, true);
            candleGroup.add(liveCandleMesh);
            
            const isGreen = liveCandleData.close >= liveCandleData.open;
            const smokeColor = isGreen ? 0x22c55e : 0xef4444;
            const smoke = createSmokeParticles(smokeColor, 15);
            smoke.group.position.set(liveCandleMesh.position.x, 0, 0);
            smokeGroup.add(smoke.group);
            liveSmokeParticles = smoke.particles;
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Movimento realista baseado no joystick
            if (moveControl.active) {
                const moveX = moveControl.currentX * moveSpeed;
                const moveZ = moveControl.currentY * moveSpeed;
                
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                forward.y = 0;
                forward.normalize();
                
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                right.y = 0;
                right.normalize();
                
                camera.position.addScaledVector(forward, -moveZ);
                camera.position.addScaledVector(right, moveX);
            }
            
            // Rotação realista baseada no joystick de olhar
            if (lookControl.active) {
                camera.rotation.y -= lookControl.currentX * lookSpeed;
                camera.rotation.x -= lookControl.currentY * lookSpeed * 0.5;
                camera.rotation.x = Math.max(-Math.PI/4, Math.min(Math.PI/4, camera.rotation.x));
            }
            
            // Atualizar elementos
            if (dataLoaded && liveCandleMesh && liveSmokeParticles.length > 0) {
                updateLiveCandle();
            }
            
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // Inicializar
        setupControls();

        // Resize
        window.addEventListener('resize', () => {
            if (camera && renderer && labelRenderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                labelRenderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        // Prevenir scroll
        document.addEventListener('touchmove', (e) => {
            if (moveControl.active || lookControl.active) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
