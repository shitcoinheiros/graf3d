<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Realm - Gráfico em Movimento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0f1a;
            color: white;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Tela inicial */
        #home-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 100% 0%, #1a1f2e, #0a0f1a);
            z-index: 1000;
            overflow-y: auto;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px;
        }

        #home-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .header {
            padding: 40px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #f7931a;
            font-size: 14px;
            letter-spacing: 2px;
            font-weight: 300;
        }

        .coin-list {
            max-width: 800px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 0 20px;
        }

        .coin-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 24px;
            padding: 25px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .coin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #f7931a, #9945FF, transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .coin-card:hover::before {
            opacity: 1;
        }

        .coin-card:active {
            transform: scale(0.99);
            background: rgba(255,255,255,0.03);
        }

        .coin-header {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .coin-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btc-icon { background: #f7931a; }
        .siren-icon { background: #00ffff; }
        .pippin-icon { background: #ff69b4; }
        .tria-icon { background: #8b5cf6; }

        .coin-info {
            flex: 1;
        }

        .coin-name {
            font-size: 20px;
            font-weight: 400;
            margin-bottom: 4px;
        }

        .coin-symbol {
            color: #94a3b8;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .coin-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .coin-price {
            font-size: 24px;
            font-weight: 300;
        }

        .coin-change {
            font-size: 14px;
            padding: 6px 12px;
            border-radius: 30px;
            background: rgba(255,255,255,0.03);
        }

        .positive { color: #22c55e; }
        .negative { color: #ef4444; }

        .enter-text {
            position: absolute;
            bottom: 25px;
            right: 25px;
            color: #94a3b8;
            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .coin-card:hover .enter-text {
            opacity: 0.5;
        }

        /* Tela do mundo */
        #world-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2000;
            display: none;
        }

        #world-screen.active {
            display: block;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 30px;
            left: 30px;
            z-index: 2100;
            background: rgba(10,15,26,0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 100px;
            padding: 8px 20px 8px 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        #world-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        #price-container {
            position: absolute;
            top: 30px;
            right: 30px;
            z-index: 2100;
            background: rgba(10,15,26,0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 100px;
            padding: 8px 25px;
            text-align: right;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        #price-value {
            font-size: 18px;
            font-weight: 300;
            color: #f7931a;
            letter-spacing: 0.5px;
        }

        #price-change {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 2px;
        }

        /* Controles */
        #move-area {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            z-index: 2100;
            opacity: 0.4;
            transition: opacity 0.3s;
            pointer-events: auto;
        }

        #move-area.active {
            opacity: 1;
        }

        .move-ring {
            width: 100%;
            height: 100%;
            border: 2px solid rgba(247,147,26,0.5);
            border-radius: 50%;
            position: relative;
            background: rgba(10,15,26,0.3);
            backdrop-filter: blur(5px);
        }

        .move-dot {
            width: 40px;
            height: 40px;
            background: rgba(247,147,26,0.9);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(247,147,26,0.5);
            transition: transform 0.1s ease;
            pointer-events: none;
        }

        #camera-area {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 100px;
            height: 100px;
            z-index: 2100;
            opacity: 0.4;
            transition: opacity 0.3s;
            pointer-events: auto;
        }

        #camera-area.active {
            opacity: 1;
        }

        .camera-ring {
            width: 100%;
            height: 100%;
            border: 2px solid rgba(153,69,255,0.5);
            border-radius: 50%;
            position: relative;
            background: rgba(10,15,26,0.3);
            backdrop-filter: blur(5px);
        }

        .camera-dot {
            width: 30px;
            height: 30px;
            background: rgba(153,69,255,0.9);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 30px rgba(153,69,255,0.5);
            transition: transform 0.1s ease;
            pointer-events: none;
        }

        #action-controls {
            position: absolute;
            bottom: 40px;
            right: 180px;
            display: flex;
            gap: 15px;
            z-index: 2100;
            pointer-events: auto;
        }

        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(10,15,26,0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.8);
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .action-btn:active {
            transform: scale(0.9);
            background: rgba(255,255,255,0.2);
            color: white;
        }

        #run-btn.active {
            background: rgba(247,147,26,0.3);
            border-color: #f7931a;
            color: #f7931a;
        }

        #exit-btn {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(239,68,68,0.2);
            border: 2px solid rgba(239,68,68,0.3);
            color: rgba(239,68,68,0.8);
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2100;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            pointer-events: auto;
        }

        #exit-btn:active {
            background: rgba(239,68,68,0.4);
            color: #ef4444;
            transform: scale(0.9);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 14px;
            z-index: 2200;
            background: rgba(10,15,26,0.8);
            backdrop-filter: blur(10px);
            padding: 16px 32px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.05);
            display: none;
        }

        #hint {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 14px;
            z-index: 2100;
            background: rgba(10,15,26,0.4);
            backdrop-filter: blur(10px);
            padding: 10px 25px;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.05);
            animation: fadeOut 4s forwards;
            pointer-events: none;
            white-space: nowrap;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        #debug-info {
            position: absolute;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            color: #94a3b8;
            font-size: 12px;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 20px;
            z-index: 2200;
            display: none;
        }

        #boundary-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f7931a;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(247,147,26,0.5);
            z-index: 2300;
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid #f7931a;
            backdrop-filter: blur(10px);
            display: none;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
        }

        #error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ef4444;
            font-size: 14px;
            z-index: 2300;
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 50px;
            border: 1px solid #ef4444;
            backdrop-filter: blur(10px);
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="home-screen">
        <div class="header">
            <div class="logo">CRYPTO REALM</div>
            <div class="subtitle">CANDLES COM PARTÍCULAS</div>
        </div>

        <div class="coin-list">
            <!-- Bitcoin -->
            <div class="coin-card" onclick="enterWorld('btc')">
                <div class="coin-header">
                    <div class="coin-icon btc-icon">₿</div>

                        <div class="coin-symbol">BTC</div>
                    </div>
                </div>
                <div class="coin-stats">
                    <span class="coin-price">$67,890</span>
                    <span class="coin-change positive">+2.34%</span>

                <span class="enter-text">ENTRAR →</span>
            </div>

            <!-- Siren -->
            <div class="coin-card" onclick="enterWorld('siren')">
                <div class="coin-header">
                    <div class="coin-icon siren-icon">🧜‍♀️</div>
                    <div class="coin-info">
                        <div class="coin-name">Siren</div>
                        <div class="coin-symbol">SIREN</div>
                    </div>
                </div>
                <div class="coin-stats">
                    <span class="coin-price">$0.89</span>
                    <span class="coin-change positive">+15.67%</span>
                </div>
                <span class="enter-text">ENTRAR →</span>
            </div>

            <!-- Pippin -->
            <div class="coin-card" onclick="enterWorld('pippin')">
                <div class="coin-header">
                    <div class="coin-icon pippin-icon">🐧</div>
                    <div class="coin-info">
                        <div class="coin-name">Pippin</div>
                        <div class="coin-symbol">PIPPIN</div>
                    </div>
                </div>
                <div class="coin-stats">
                    <span class="coin-price">$0.0023</span>
                    <span class="coin-change negative">-8.12%</span>
                </div>
                <span class="enter-text">ENTRAR →</span>
            </div>

            <!-- Tria -->
            <div class="coin-card" onclick="enterWorld('tria')">
                <div class="coin-header">
                    <div class="coin-icon tria-icon">🔺</div>
                    <div class="coin-info">
                        <div class="coin-name">Tria</div>
                        <div class="coin-symbol">TRIA</div>
                    </div>
                </div>
                <div class="coin-stats">
                    <span class="coin-price">$12.45</span>
                    <span class="coin-change positive">+5.23%</span>
                </div>
                <span class="enter-text">ENTRAR →</span>
            </div>
        </div>
    </div>

    <div id="world-screen">
        <div id="hud">
            <div id="world-icon">₿</div>
            <div>
                <div id="world-coin-name">Bitcoin</div>
                <div id="world-coin-symbol" style="color:#94a3b8; font-size:11px;">BTC</div>
            </div>
        </div>

        <div id="price-container">
            <div id="price-value">$67,890</div>
            <div id="price-change">+2.34%</div>
        </div>

        <div id="move-area">
            <div class="move-ring">
                <div class="move-dot" id="move-dot"></div>
            </div>
        </div>

        <div id="camera-area">
            <div class="camera-ring">
                <div class="camera-dot" id="camera-dot"></div>
            </div>
        </div>

        <div id="action-controls">
            <button class="action-btn" id="jump-btn">↑</button>
            <button class="action-btn" id="run-btn">→</button>
        </div>

        <button id="exit-btn">✕</button>
        <div id="loading">CARREGANDO SALA</div>
        <div id="hint">VEJA AS PARTÍCULAS SUBINDO!</div>
        <div id="debug-info"></div>
        <div id="boundary-warning">🚫 LIMITE DA SALA</div>
        <div id="error-message"></div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const COINS = {
            btc: { name: 'Bitcoin', symbol: 'BTC', binance: 'BTCUSDT', icon: '₿', color: '#f7931a', bgColor: 0xf7931a },
            siren: { name: 'Siren', symbol: 'SIREN', binance: 'SIRENUSDT', icon: '🧜‍♀️', color: '#00ffff', bgColor: 0x00ffff },
            pippin: { name: 'Pippin', symbol: 'PIPPIN', binance: 'PIPPINUSDT', icon: '🐧', color: '#ff69b4', bgColor: 0xff69b4 },
            tria: { name: 'Tria', symbol: 'TRIA', binance: 'TRIAUSDT', icon: '🔺', color: '#8b5cf6', bgColor: 0x8b5cf6 }
        };

        let currentCoin = 'btc';
        let scene, camera, renderer, labelRenderer;
        
        // Personagem
        let character = {
            mesh: null,
            position: new THREE.Vector3(0, 0, 10),
            rotation: 0,
            height: 2,
            isRunning: false
        };
        
        // Elementos do gráfico
        let candleGroup, bollingerGroup, smokeGroup;
        let historicalCandles = [];
        let liveCandleMesh = null;
        let liveSmokeParticles = [];
        let liveCandleData = null;
        let minVolume = 100, maxVolume = 1000;
        let lastPrice = 67000;
        let binanceSocket = null;
        let dataLoaded = false;
        
        // Posição do gráfico
        let graphPosition = {
            x: 0,
            z: -5,
            targetZ: -5,
            speed: 0.1
        };
        
        // Controles
        let moveControl = { 
            active: false, 
            startX: 0, 
            startY: 0, 
            currentX: 0, 
            currentY: 0,
            worldX: 0,
            worldZ: 0
        };
        
        let cameraControl = { 
            active: false, 
            startX: 0, 
            startY: 0, 
            currentX: 0, 
            currentY: 0 
        };
        
        let cameraAngle = { horizontal: 0, vertical: 0.5 };
        let moveSpeed = 0.15;
        let cameraDistance = 8;
        let cameraHeight = 3;
        
        // LIMITES DA SALA
        const ROOM_SIZE = 20;
        const WALL_HEIGHT = 10;
        const WALL_THICKNESS = 0.5;
        
        // Parâmetros visuais
        const WICK_RADIUS = 0.08;
        const SPACING = 2.5;
        const GROUND_Y = 0;
        const BB_PERIOD = 20;
        const BB_STD = 2;
        
        // Parâmetros de volume
        const MIN_HEIGHT = 0.5;
        const MAX_HEIGHT = 8.0;
        const MIN_RADIUS = 0.3;
        const MAX_RADIUS = 1.5;
        const MAX_CANDLES = 20;

        const TIMEFRAMES = { '1m': { binance: '1m', limit: 30, ms: 60 * 1000 } };

        // Elementos DOM
        const homeScreen = document.getElementById('home-screen');
        const worldScreen = document.getElementById('world-screen');
        const loadingEl = document.getElementById('loading');
        const worldIcon = document.getElementById('world-icon');
        const worldCoinName = document.getElementById('world-coin-name');
        const worldCoinSymbol = document.getElementById('world-coin-symbol');
        const priceValue = document.getElementById('price-value');
        const priceChange = document.getElementById('price-change');
        const debugInfo = document.getElementById('debug-info');
        const boundaryWarning = document.getElementById('boundary-warning');
        const errorMessage = document.getElementById('error-message');
        
        const moveArea = document.getElementById('move-area');
        const cameraArea = document.getElementById('camera-area');
        const moveDot = document.getElementById('move-dot');
        const cameraDot = document.getElementById('camera-dot');
        const runBtn = document.getElementById('run-btn');
        const jumpBtn = document.getElementById('jump-btn');
        const exitBtn = document.getElementById('exit-btn');

        window.enterWorld = (coin) => {
            currentCoin = coin;
            const coinData = COINS[coin];
            
            worldIcon.innerHTML = coinData.icon;
            worldIcon.style.background = coinData.color;
            worldCoinName.textContent = coinData.name;
            worldCoinSymbol.textContent = coinData.symbol;
            
            homeScreen.classList.add('hidden');
            worldScreen.classList.add('active');
            
            loadingEl.style.display = 'block';
            
            setTimeout(() => {
                initWorld();
            }, 100);
        };

        window.exitWorld = () => {
            worldScreen.classList.remove('active');
            homeScreen.classList.remove('hidden');
            
            if (binanceSocket) binanceSocket.close();
            if (renderer) {
                renderer.dispose();
                renderer = null;
            }
        };

        function setupControls() {
            moveArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                moveControl.active = true;
                const rect = moveArea.getBoundingClientRect();
                moveControl.startX = rect.left + rect.width/2;
                moveControl.startY = rect.top + rect.height/2;
                moveControl.currentX = 0;
                moveControl.currentY = 0;
                moveControl.worldX = 0;
                moveControl.worldZ = 0;
                moveArea.classList.add('active');
                moveDot.style.transform = 'translate(-50%, -50%)';
            });

            moveArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!moveControl.active) return;
                
                const touch = e.touches[0];
                const dx = touch.clientX - moveControl.startX;
                const dy = touch.clientY - moveControl.startY;
                
                const maxDistance = 50;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance > maxDistance) {
                    moveControl.currentX = (dx / distance) * maxDistance;
                    moveControl.currentY = (dy / distance) * maxDistance;
                } else {
                    moveControl.currentX = dx;
                    moveControl.currentY = dy;
                }
                
                moveDot.style.transform = `translate(calc(-50% + ${moveControl.currentX}px), calc(-50% + ${moveControl.currentY}px))`;
                
                moveControl.worldX = moveControl.currentX / maxDistance;
                moveControl.worldZ = moveControl.currentY / maxDistance;
            });

            moveArea.addEventListener('touchend', (e) => {
                e.preventDefault();
                moveControl.active = false;
                moveControl.currentX = 0;
                moveControl.currentY = 0;
                moveControl.worldX = 0;
                moveControl.worldZ = 0;
                moveArea.classList.remove('active');
                moveDot.style.transform = 'translate(-50%, -50%)';
            });

            cameraArea.addEventListener('touchstart', (e) => {
                e.preventDefault();
                cameraControl.active = true;
                const rect = cameraArea.getBoundingClientRect();
                cameraControl.startX = rect.left + rect.width/2;
                cameraControl.startY = rect.top + rect.height/2;
                cameraControl.currentX = 0;
                cameraControl.currentY = 0;
                cameraArea.classList.add('active');
                cameraDot.style.transform = 'translate(-50%, -50%)';
            });

            cameraArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!cameraControl.active) return;
                
                const touch = e.touches[0];
                const dx = touch.clientX - cameraControl.startX;
                const dy = touch.clientY - cameraControl.startY;
                
                const maxDistance = 40;
                const distance = Math.sqrt(dx*dx + dy*dy);
                
                if (distance > maxDistance) {
                    cameraControl.currentX = (dx / distance) * maxDistance;
                    cameraControl.currentY = (dy / distance) * maxDistance;
                } else {
                    cameraControl.currentX = dx;
                    cameraControl.currentY = dy;
                }
                
                cameraDot.style.transform = `translate(calc(-50% + ${cameraControl.currentX}px), calc(-50% + ${cameraControl.currentY}px))`;
                
                cameraAngle.horizontal += (cameraControl.currentX / maxDistance) * 0.05;

            });

        function processHistoricalData(data) {
            // Manter apenas os últimos MAX_CANDLES
            if (data.length > MAX_CANDLES) {
                data = data.slice(-MAX_CANDLES);
            }
            
            historicalCandles = data.slice(0, -1);
            liveCandleData = { ...data[data.length - 1] };
            lastPrice = liveCandleData.close;
            
            // Calcular min/max de volume
            minVolume = Infinity;
            maxVolume = -Infinity;
            
            [...historicalCandles, liveCandleData].forEach(c => {
                if (c.volume) {
                    minVolume = Math.min(minVolume, c.volume);
                    maxVolume = Math.max(maxVolume, c.volume);
                }
            });
            
            if (minVolume === Infinity || minVolume === maxVolume) {
                minVolume = 100;
                maxVolume = 1000;
            }
            
            dataLoaded = true;
            renderCandles();
            updatePriceDisplay();
        }

        function startSimulatedTrades() {
            setInterval(() => {
                if (!liveCandleData || !dataLoaded) return;
                
                const isBuy = Math.random() > 0.5;
                const change = (Math.random() * 100) * (isBuy ? 1 : -1);
                const newPrice = Math.max(0.01, lastPrice + change);
                const volume = Math.random() * 200 + 50;
                
                processNewTrade({
                    price: newPrice,
                    time: Date.now(),
                    volume: volume,
                    isBuy: isBuy
                });
            }, 800);
        }

        function processNewTrade(trade) {
            if (!liveCandleData || !dataLoaded) return;
            
            const tf = TIMEFRAMES['1m'];
            const periodStart = Math.floor(liveCandleData.time / tf.ms) * tf.ms;
            const tradePeriodStart = Math.floor(trade.time / tf.ms) * tf.ms;
            
            if (tradePeriodStart > periodStart) {
                // NOVO CANDLE - Mover o gráfico para trás
                historicalCandles.push({ ...liveCandleData });
                
                // Manter apenas os últimos MAX_CANDLES
                if (historicalCandles.length > MAX_CANDLES) {
                    historicalCandles.shift();
                }
                
                // Mover o gráfico para trás para dar espaço
                graphPosition.targetZ -= SPACING * 0.5;
                
                // Limitar para não sair da sala
                graphPosition.targetZ = Math.max(-ROOM_SIZE + 10, graphPosition.targetZ);
                
                liveCandleData = {
                    time: trade.time,
                    open: trade.price,
                    high: trade.price,
                    low: trade.price,
                    close: trade.price,
                    volume: trade.volume || 100,
                    isBuy: trade.isBuy
                };
                
                renderCandles();
                return;
            }
            
            if (liveCandleData.open === 0) liveCandleData.open = trade.price;
            liveCandleData.high = Math.max(liveCandleData.high, trade.price);
            liveCandleData.low = Math.min(liveCandleData.low, trade.price);
            liveCandleData.close = trade.price;
            
            if (trade.volume) {
                liveCandleData.volume = (liveCandleData.volume || 0) + trade.volume;
                if (liveCandleData.volume > maxVolume) {
                    maxVolume = liveCandleData.volume;
                }
            }
            
            liveCandleData.isBuy = trade.isBuy;
            
            lastPrice = trade.price;
            updateLiveCandle();
            updatePriceDisplay();
        }

        function updatePriceDisplay() {
            if (!liveCandleData) return;
            
            priceValue.textContent = `$${liveCandleData.close.toFixed(2)}`;
            const change = ((liveCandleData.close - liveCandleData.open) / liveCandleData.open * 100).toFixed(2);
            const changeClass = change >= 0 ? '📈' : '📉';
            priceChange.textContent = `${changeClass} ${Math.abs(change)}%`;
            priceChange.style.color = change >= 0 ? '#22c55e' : '#ef4444';
        }

        function calculateCandleDimensions(volume, isBuy) {
            const normalizedVolume = (volume - minVolume) / (maxVolume - minVolume);
            
            if (isBuy) {
                const height = MIN_HEIGHT + normalizedVolume * (MAX_HEIGHT - MIN_HEIGHT);
                const radius = MAX_RADIUS - normalizedVolume * (MAX_RADIUS - MIN_RADIUS);
                return { height, radius };
            } else {
                const height = MAX_HEIGHT - normalizedVolume * (MAX_HEIGHT - MIN_HEIGHT);
                const radius = MIN_RADIUS + normalizedVolume * (MAX_RADIUS - MIN_RADIUS);
                return { height, radius };
            }
        }

        function createCandle(data, index, total, isLive = false) {
            const { open, high, low, close, volume, isBuy } = data;
            
            const isGreen = close >= open;
            const bodyColor = isGreen ? 0x22c55e : 0xef4444;
            
            const dimensions = calculateCandleDimensions(volume, isBuy);
            
            // Posição X baseada no índice, mas centralizada
            const xPos = (index - total/2) * SPACING;
            
            const group = new THREE.Group();
            group.position.set(xPos, 0, 0);
            
            // Corpo do candle
            const bodyGeo = new THREE.CylinderGeometry(dimensions.radius, dimensions.radius, dimensions.height, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ 
                color: bodyColor,
                roughness: 0.3,
                metalness: 0.2,
                emissive: bodyColor,
                emissiveIntensity: isLive ? 0.8 : 0.2,
                transparent: true,
                opacity: 0.9
            });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = dimensions.height / 2;
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);
            
            // Pavio
            const wickHeight = Math.abs(high - low) * 0.1;
            if (wickHeight > 0.5) {
                const wickGeo = new THREE.CylinderGeometry(WICK_RADIUS, WICK_RADIUS, wickHeight, 8);
                const wickMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
                const wick = new THREE.Mesh(wickGeo, wickMat);
                wick.position.y = dimensions.height / 2 + (wickHeight / 2);
                wick.castShadow = true;
                group.add(wick);
            }
            
            if (isLive) {
                // Brilho interno
                const glowGeo = new THREE.SphereGeometry(dimensions.radius * 1.5, 8);
                const glowMat = new THREE.MeshStandardMaterial({
                    color: bodyColor,
                    emissive: bodyColor,
                    emissiveIntensity: 0.5,
                    transparent: true,
                    opacity: 0.3
                });
                const glow = new THREE.Mesh(glowGeo, glowMat);
                glow.position.y = dimensions.height / 2;
                group.add(glow);
                
                // Guardar referência para atualização
                group.userData = { body, dimensions };
            }
            
            return group;
        }

        // FUNÇÃO CORRIGIDA DE PARTÍCULAS
        function createSmokeParticles(color, count = 25) {
            const particles = [];
            const particleGroup = new THREE.Group();
            
            const geometry = new THREE.SphereGeometry(0.15, 6, 6);
            
            for (let i = 0; i < count; i++) {
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.8,
                    transparent: true,
                    opacity: 0.7
                });
                
                const particle = new THREE.Mesh(geometry, material);
                
                // Posição inicial aleatória ao redor do topo do candle
                const angle = Math.random() * Math.PI * 2;
                const radius = 0.5 + Math.random() * 0.5;
                const height = 2 + Math.random() * 3;
                
                particle.position.set(
                    Math.cos(angle) * radius,
                    height,
                    Math.sin(angle) * radius
                );
                
                particle.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.03,
                        Math.random() * 0.04 + 0.02, // Velocidade para cima
                        (Math.random() - 0.5) * 0.03
                    ),
                    baseY: height,
                    angle: angle,
                    radius: radius,
                    life: 1.0
                };
                
                particle.castShadow = false;
                particle.receiveShadow = false;
                
                particleGroup.add(particle);
                particles.push(particle);
            }
            
            return { group: particleGroup, particles };
        }

        // FUNÇÃO CORRIGIDA DE ATUALIZAÇÃO DAS PARTÍCULAS
        function updateSmoke(particles, candleY, isGreen, volume, candleHeight) {
            if (!particles || particles.length === 0) return;
            
            const time = Date.now() * 0.002;
            const color = isGreen ? 0x22c55e : 0xef4444;
            const intensity = Math.min(1, (volume || 100) / 500);
            
            particles.forEach((particle, i) => {
                const data = particle.userData;
                
                // Movimento das partículas
                particle.position.x += data.velocity.x;
                particle.position.y += data.velocity.y;
                particle.position.z += data.velocity.z;
                
                // Efeito de rotação
                data.velocity.x += Math.sin(time + i) * 0.001;
                data.velocity.z += Math.cos(time + i) * 0.001;
                
                // Reset quando sobe demais
                if (particle.position.y > candleY + candleHeight + 4) {
                    // Reiniciar partícula na base do candle
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 0.5 + Math.random() * 0.5;
                    
                    particle.position.set(
                        Math.cos(angle) * radius,
                        candleY + candleHeight * 0.3,
                        Math.sin(angle) * radius
                    );
                    
                    data.velocity.set(
                        (Math.random() - 0.5) * 0.03,
                        Math.random() * 0.05 + 0.03,
                        (Math.random() - 0.5) * 0.03
                    );
                }
                
                // Opacidade pulsante baseada na intensidade
                particle.material.opacity = 0.5 + Math.sin(time * 4 + i) * 0.3;
                particle.material.emissiveIntensity = intensity * (0.5 + Math.sin(time * 3) * 0.3);
                
                // Atualizar cor baseada na tendência
                particle.material.color.setHex(color);
                particle.material.emissive.setHex(color);
            });
        }

        function updateLiveCandle() {
            if (!liveCandleMesh || !liveCandleData) return;
            
            const { body, dimensions } = liveCandleMesh.userData;
            const { open, close, volume, isBuy } = liveCandleData;
            
            const isGreen = close >= open;
            const bodyColor = isGreen ? 0x22c55e : 0xef4444;
            
            const newDimensions = calculateCandleDimensions(volume || 100, isBuy);
            
            // Atualizar tamanho do candle
            body.scale.x = newDimensions.radius / MIN_RADIUS;
            body.scale.z = newDimensions.radius / MIN_RADIUS;
            body.scale.y = newDimensions.height;
            body.position.y = newDimensions.height / 2;
            body.material.color.setHex(bodyColor);
            body.material.emissive.setHex(bodyColor);
            body.material.emissiveIntensity = 0.8 + Math.sin(Date.now() * 0.01) * 0.3;
            
            // Atualizar partículas com a altura atual do candle
            if (liveSmokeParticles.length > 0) {
                updateSmoke(liveSmokeParticles, newDimensions.height / 2, isGreen, volume, newDimensions.height);
            }
        }

        function renderCandles() {
            while(candleGroup.children.length) {
                candleGroup.remove(candleGroup.children[0]);
            }
            
            while(smokeGroup.children.length) {
                smokeGroup.remove(smokeGroup.children[0]);
            }
            
            liveSmokeParticles = [];
            
            const total = historicalCandles.length + 1;
            
            historicalCandles.forEach((candle, index) => {
                const staticCandle = createCandle(candle, index, total, false);
                candleGroup.add(staticCandle);
            });
            
            const liveIndex = historicalCandles.length;
            liveCandleMesh = createCandle(liveCandleData, liveIndex, total, true);
            candleGroup.add(liveCandleMesh);
            
            // CRIAR PARTÍCULAS PARA O CANDLE AO VIVO
            const isGreen = liveCandleData.close >= liveCandleData.open;
            const smokeColor = isGreen ? 0x22c55e : 0xef4444;
            
            // Criar grupo de partículas separado
            const smoke = createSmokeParticles(smokeColor, 30); // Mais partículas
            
            // Posicionar as partículas no mesmo lugar do candle ao vivo
            smoke.group.position.set(liveCandleMesh.position.x, 0, 0);
            
            // Adicionar ao grupo de fumaça
            smokeGroup.add(smoke.group);
            liveSmokeParticles = smoke.particles;
            
            console.log('Partículas criadas:', liveSmokeParticles.length); // Debug
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Movimento suave do gráfico
            graphPosition.z += (graphPosition.targetZ - graphPosition.z) * 0.05;
            
            candleGroup.position.z = graphPosition.z;
            bollingerGroup.position.z = graphPosition.z;
            smokeGroup.position.z = graphPosition.z;
            
            // Movimento do personagem
            if (moveControl.active && (Math.abs(moveControl.worldX) > 0.1 || Math.abs(moveControl.worldZ) > 0.1)) {
                
                const angle = cameraAngle.horizontal;
                
                const forwardX = Math.sin(angle);
                const forwardZ = Math.cos(angle);
                const rightX = Math.cos(angle);
                const rightZ = -Math.sin(angle);
                
                const newX = character.position.x + (forwardX * moveControl.worldZ + rightX * moveControl.worldX) * moveSpeed;
                const newZ = character.position.z + (forwardZ * moveControl.worldZ + rightZ * moveControl.worldX) * moveSpeed;
                
                const limit = ROOM_SIZE - 1;
                character.position.x = Math.max(-limit, Math.min(limit, newX));
                character.position.z = Math.max(-limit, Math.min(limit, newZ));
                
                if (Math.abs(newX) > limit || Math.abs(newZ) > limit) {
                    boundaryWarning.style.display = 'block';
                    setTimeout(() => {
                        boundaryWarning.style.display = 'none';
                    }, 300);
                }
                
                if (Math.abs(moveControl.worldX) > 0.1 || Math.abs(moveControl.worldZ) > 0.1) {
                    character.rotation = Math.atan2(
                        forwardX * moveControl.worldZ + rightX * moveControl.worldX,
                        forwardZ * moveControl.worldZ + rightZ * moveControl.worldX
                    );
                }
                
                if (character.mesh) {
                    character.mesh.position.copy(character.position);
                    character.mesh.rotation.y = character.rotation;
                }
                
                debugInfo.style.display = 'block';
                debugInfo.innerHTML = `Partículas: ${liveSmokeParticles.length} | Vol: ${liveCandleData?.volume.toFixed(0)}`;
            } else {
                debugInfo.style.display = 'none';
            }
            
            // Posicionar câmera
            if (character.mesh) {
                const camX = character.position.x + Math.sin(cameraAngle.horizontal) * cameraDistance;
                const camZ = character.position.z + Math.cos(cameraAngle.horizontal) * cameraDistance;
                const camY = character.position.y + cameraHeight * cameraAngle.vertical;
                
                camera.position.set(
                    Math.max(-ROOM_SIZE + 2, Math.min(ROOM_SIZE - 2, camX)),
                    Math.max(2, Math.min(WALL_HEIGHT - 2, camY)),
                    Math.max(-ROOM_SIZE + 2, Math.min(ROOM_SIZE - 2, camZ))
                );
                
                camera.lookAt(character.position.x, character.position.y + 1, character.position.z);
            }
            
            // Atualizar elementos
            if (dataLoaded && liveCandleMesh && liveSmokeParticles.length > 0) {
                updateLiveCandle();
            }
            
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        setupControls();

        window.addEventListener('resize', () => {
            if (camera && renderer && labelRenderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                labelRenderer.setSize(window.innerWidth, window.innerHeight);
            }
        });

        document.addEventListener('touchmove', (e) => {
            if (moveControl.active || cameraControl.active) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
