<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Support - Advanced Logic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .msg-appear { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn { transition: all 0.2s; border: 1px solid #334155; }
        .option-btn:hover { background: #f97316; border-color: #f97316; color: white; transform: scale(1.02); }
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 40% { color: #f97316; text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .5em 0 0 #f97316, 1em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .5em 0 0 #f97316, 1em 0 0 #f97316; } }
        .correction-badge { font-size: 10px; background: rgba(249, 115, 22, 0.1); color: #f97316; padding: 2px 6px; border-radius: 4px; margin-top: 4px; display: inline-block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center font-bold shadow-lg shadow-orange-900/20 text-white text-xl">₿</div>
            <div>
                <h1 class="text-sm font-bold leading-none text-white">CryptoBot <span class="text-orange-500 text-[10px]">HYBRID-WIKI</span></h1>
                <p class="text-[9px] text-emerald-500 uppercase tracking-widest mt-1 font-bold">● Inteligência de Termos Ativa</p>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
        <div class="flex justify-start msg-appear">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl max-w-[85%] shadow-lg">
                <p class="text-[10px] font-black uppercase text-orange-500 mb-1">Assistente Inteligente</p>
                <div class="text-sm leading-relaxed">
                    Olá! Corrigi os erros técnicos. Agora estou ligado à <strong>CoinGecko (em Português)</strong> e ao <strong>DuckDuckGo</strong>. 
                    Podes perguntar sobre moedas ou pessoas.
                </div>
                <div id="initial-options" class="mt-4 flex flex-wrap gap-2"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" autocomplete="off" 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/50 transition-all placeholder-slate-500"
                placeholder="Ex: 'quem eh o vitalik?' ou 'o q eh solana?'">
            <button type="submit" id="send-btn" class="bg-orange-600 p-3.5 rounded-xl hover:bg-orange-500 transition-all active:scale-90 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </form>
    </footer>

    <script>
        const BOT_DATA = {
            options: [
                { label: "Bitcoin", key: "bitcoin" },
                { label: "Ethereum", key: "ethereum" },
                { label: "O que é Web3?", key: "web3" }
            ],
            responses: {
                "bitcoin": ["O Bitcoin é a primeira rede descentralizada do mundo, permitindo transações sem intermediários."],
                "ethereum": ["O Ethereum é a plataforma líder para contratos inteligentes e aplicações financeiras descentralizadas."],
                "web3": ["Web3 é a visão de uma internet descentralizada baseada em blockchain."],
                "blockchain": ["Blockchain é um livro-razão digital imutável e distribuído."]
            },
            fallbacks: [
                "Não consegui encontrar nada sobre isso, nem na internet. Tenta outro termo!",
                "Parece um tema muito específico. Podes simplificar a pergunta?",
                "Infelizmente a minha pesquisa externa não deu frutos desta vez.",
                "Não entendi bem. Tenta usar apenas o nome da moeda (ex: 'Cardano')."
            ]
        };

        // Função utilitária para pegar item aleatório (Corrigindo o erro de ReferenceError)
        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        // ALGORITMO DE DISTÂNCIA DE LEVENSHTEIN (Fuzzy Match)
        function getSimilarity(s1, s2) {
            let longer = s1.length < s2.length ? s2 : s1;
            let shorter = s1.length < s2.length ? s1 : s2;
            if (longer.length == 0) return 1.0;
            return (longer.length - editDistance(longer, shorter)) / parseFloat(longer.length);
        }

        function editDistance(s1, s2) {
            s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
            let costs = new Array();
            for (let i = 0; i <= s1.length; i++) {
                let lastValue = i;
                for (let j = 0; j <= s2.length; j++) {
                    if (i == 0) costs[j] = j;
                    else if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) != s2.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
                if (i > 0) costs[s2.length] = lastValue;
            }
            return costs[s2.length];
        }

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');
        const initialOptions = document.getElementById('initial-options');

        function appendMessage(role, text, isPending = false) {
            const isBot = role === 'bot';
            const div = document.createElement('div');
            div.className = `flex ${isBot ? 'justify-start' : 'justify-end'} msg-appear mb-4`;
            
            div.innerHTML = `
                <div class="${isBot ? 'bg-slate-800 border border-slate-700' : 'bg-orange-600 text-white shadow-lg'} p-3.5 rounded-2xl max-w-[85%] text-sm">
                    <p class="text-[9px] font-black uppercase opacity-50 mb-1 tracking-tighter">${isBot ? 'Expert Bot' : 'Tu'}</p>
                    <div class="content ${isPending ? 'loading-dots' : ''}">${text}</div>
                </div>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function extractCoreTerm(input) {
            return input.toLowerCase()
                .replace(/[?|!|.|,]/g, "")
                .replace(/\b(quem|que|quais|qual|o|eh|é|e|significa|saber|sobre|fale|falar|conte|o que|quem e|quem eh)\b/g, "")
                .trim();
        }

        // CAMADA DE PESQUISA HÍBRIDA (CoinGecko PT + DuckDuckGo)
        async function fetchExternalKnowledge(query) {
            try {
                // 1. Tentar CoinGecko (Agora em Português)
                const cgUrl = `https://api.coingecko.com/api/v3/coins/${query.replace(/\s+/g, '-')}`;
                const cgRes = await fetch(cgUrl);
                
                if (cgRes.ok) {
                    const cgData = await cgRes.json();
                    // Prioridade para Português, senão Inglês, senão Nulo
                    const desc = cgData.description.pt || cgData.description.en || null;
                    if (desc) {
                        // Limpar tags HTML e retornar o primeiro parágrafo
                        const cleanDesc = desc.replace(/<[^>]*>?/gm, '').split('.')[0];
                        return cleanDesc + ". (Fonte: CoinGecko)";
                    }
                }

                // 2. Tentar DuckDuckGo (Para termos gerais/pessoas)
                const ddgUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1`;
                const ddgRes = await fetch(ddgUrl);
                if (ddgRes.ok) {
                    const ddgData = await ddgRes.json();
                    return ddgData.AbstractText || null;
                }
                
                return null;
            } catch (e) {
                console.warn("Erro na busca:", e);
                return null;
            }
        }

        async function handleInput(e) {
            if (e) e.preventDefault();
            const rawInput = userInput.value.trim();
            if (!rawInput) return;

            appendMessage('user', rawInput);
            userInput.value = '';

            const pendingDiv = appendMessage('bot', 'A analisar o mercado', true);
            const coreTerm = extractCoreTerm(rawInput);
            
            let bestMatch = null;
            let highestScore = 0;
            let response = null;

            // Fuzzy Match Local
            for (let key in BOT_DATA.responses) {
                const score = getSimilarity(coreTerm, key);
                if (score > 0.7 && score > highestScore) {
                    highestScore = score;
                    bestMatch = key;
                }
            }

            if (bestMatch) {
                response = BOT_DATA.responses[bestMatch][0];
            } else {
                response = await fetchExternalKnowledge(coreTerm);
            }

            // Fallback (Usa getRandom agora que está definida)
            if (!response) response = getRandom(BOT_DATA.fallbacks);

            setTimeout(() => {
                const contentArea = pendingDiv.querySelector('.content');
                contentArea.innerText = response;
                contentArea.classList.remove('loading-dots');
                
                if (bestMatch && highestScore < 1.0) {
                    const badge = document.createElement('div');
                    badge.className = "correction-badge";
                    badge.innerHTML = `Entendi: "<strong>${bestMatch}</strong>"`;
                    pendingDiv.querySelector('.bg-slate-800').appendChild(badge);
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 600);
        }

        function showOptions() {
            initialOptions.innerHTML = '';
            BOT_DATA.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn bg-slate-900/50 px-3 py-1.5 rounded-lg text-xs text-slate-300";
                btn.innerText = opt.label;
                btn.onclick = () => { userInput.value = opt.label; handleInput(); };
                initialOptions.appendChild(btn);
            });
        }

        showOptions();
        chatForm.onsubmit = handleInput;
    </script>
</body>
</html>
