<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Support - IQ.Wiki Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .msg-appear { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn { transition: all 0.2s; border: 1px solid #334155; }
        .option-btn:hover { background: #f97316; border-color: #f97316; color: white; transform: scale(1.02); }
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 40% { color: #f97316; text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .5em 0 0 #f97316, 1em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .5em 0 0 #f97316, 1em 0 0 #f97316; } }
        .source-badge { font-size: 9px; background: #1e293b; color: #94a3b8; padding: 2px 6px; border-radius: 4px; margin-top: 8px; display: inline-block; border: 1px solid #334155; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center font-bold shadow-lg shadow-orange-900/20 text-white text-xl">₿</div>
            <div>
                <h1 class="text-sm font-bold leading-none text-white">CryptoBot <span class="text-orange-500 text-[10px]">IQ-WIKI</span></h1>
                <p class="text-[9px] text-emerald-500 uppercase tracking-widest mt-1 font-bold">● Conectado à Enciclopédia Web3</p>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
        <div class="flex justify-start msg-appear">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl max-w-[85%] shadow-lg">
                <p class="text-[10px] font-black uppercase text-orange-500 mb-1">Assistente Enciclopédico</p>
                <div class="text-sm leading-relaxed">
                    Olá! Agora estou conectado diretamente à <strong>IQ.wiki</strong>. Posso explicar quase qualquer projeto de cripto, DeFi ou NFT. 
                    <br><br>Tente: <em class="text-orange-400">"O que é Polkadot?"</em> ou <em class="text-orange-400">"Siren AI"</em>.
                </div>
                <div id="initial-options" class="mt-4 flex flex-wrap gap-2"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" autocomplete="off" 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/50 transition-all placeholder-slate-500"
                placeholder="Pergunte sobre qualquer projeto Web3...">
            <button type="submit" id="send-btn" class="bg-orange-600 p-3.5 rounded-xl hover:bg-orange-500 transition-all active:scale-90 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </form>
    </footer>

    <script>
        const BOT_DATA = {
            fallbacks: [
                "Não encontrei informações sobre isso na IQ.wiki. Pode verificar se o nome está correto?",
                "Esse projeto parece ser muito novo ou obscuro. Tente outro termo!",
                "Infelizmente, a enciclopédia IQ.wiki não retornou dados para essa busca."
            ]
        };

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');

        function appendMessage(role, text, isPending = false, source = null) {
            const isBot = role === 'bot';
            const div = document.createElement('div');
            div.className = `flex ${isBot ? 'justify-start' : 'justify-end'} msg-appear mb-4`;
            
            let html = `
                <div class="${isBot ? 'bg-slate-800 border border-slate-700' : 'bg-orange-600 text-white shadow-lg'} p-3.5 rounded-2xl max-w-[85%] text-sm">
                    <p class="text-[9px] font-black uppercase opacity-50 mb-1 tracking-tighter">${isBot ? 'Expert Bot' : 'Tu'}</p>
                    <div class="content ${isPending ? 'loading-dots' : ''}">${text}</div>
                    ${source ? `<div class="source-badge">Fonte: ${source}</div>` : ''}
                </div>
            `;
            
            div.innerHTML = html;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        // FUNÇÃO DE TRADUÇÃO SIMPLES (Google Translate API Gratuita)
        async function translateToPT(text) {
            try {
                const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=pt&dt=t&q=${encodeURIComponent(text)}`);
                const data = await res.json();
                return data[0].map(x => x[0]).join('');
            } catch (e) {
                return text; // Se falhar, retorna o original
            }
        }

        // INTEGRAÇÃO COM IQ.WIKI (GraphQL)
        async function fetchIQWiki(query) {
            const GQL_QUERY = {
                query: `
                query GetWikis($title: String) {
                    wikis(title: $title, limit: 1) {
                        id
                        title
                        summary
                        content
                    }
                }`,
                variables: { title: query }
            };

            try {
                const response = await fetch('https://api.iq.wiki/graphql', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(GQL_QUERY)
                });

                const result = await response.json();
                if (result.data && result.data.wikis && result.data.wikis.length > 0) {
                    const wiki = result.data.wikis[0];
                    // Traduzimos o resumo para Português
                    const translatedSummary = await translateToPT(wiki.summary || wiki.content.substring(0, 300));
                    return { text: translatedSummary, title: wiki.title };
                }
                return null;
            } catch (error) {
                console.error("Erro IQ.Wiki:", error);
                return null;
            }
        }

        async function handleInput(e) {
            if (e) e.preventDefault();
            const rawInput = userInput.value.trim();
            if (!rawInput) return;

            appendMessage('user', rawInput);
            userInput.value = '';

            const pendingDiv = appendMessage('bot', 'Consultando IQ.wiki', true);
            
            // Limpa termos como "o que é" para a busca ser mais pura
            const cleanTerm = rawInput.toLowerCase()
                .replace(/\b(quem|que|quais|qual|o|eh|é|e|significa|saber|sobre|fale|falar|o que|quem e|quem eh)\b/g, "")
                .trim();

            const result = await fetchIQWiki(cleanTerm);
            
            setTimeout(() => {
                const contentArea = pendingDiv.querySelector('.content');
                if (result) {
                    contentArea.innerText = result.text;
                    const badge = document.createElement('div');
                    badge.className = "source-badge";
                    badge.innerText = `Fonte: IQ.wiki (${result.title})`;
                    pendingDiv.querySelector('.bg-slate-800').appendChild(badge);
                } else {
                    contentArea.innerText = getRandom(BOT_DATA.fallbacks);
                }
                contentArea.classList.remove('loading-dots');
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        chatForm.onsubmit = handleInput;
    </script>
</body>
</html>
