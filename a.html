<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Support - Enciclopédia Live</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .msg-appear { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn { transition: all 0.2s; border: 1px solid #334155; }
        .option-btn:hover { background: #f97316; border-color: #f97316; color: white; transform: scale(1.02); }
        .loading-dots:after { content: ' .'; animation: dots 1s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { color: rgba(0,0,0,0); text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 40% { color: #f97316; text-shadow: .5em 0 0 rgba(0,0,0,0), 1em 0 0 rgba(0,0,0,0); } 60% { text-shadow: .5em 0 0 #f97316, 1em 0 0 rgba(0,0,0,0); } 80%, 100% { text-shadow: .5em 0 0 #f97316, 1em 0 0 #f97316; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center font-bold shadow-lg shadow-orange-900/20 text-white text-xl">₿</div>
            <div>
                <h1 class="text-sm font-bold leading-none text-white">CryptoBot <span class="text-orange-500 text-[10px]">WIKI-LIVE</span></h1>
                <p class="text-[9px] text-emerald-500 uppercase tracking-widest mt-1 font-bold">● Conectado à Wikipedia</p>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
        <div class="flex justify-start msg-appear">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl max-w-[85%] shadow-lg">
                <p class="text-[10px] font-black uppercase text-orange-500 mb-1">Assistente Enciclopédico</p>
                <div class="text-sm leading-relaxed">
                    Olá! Estou conectado à base de dados do DuckDuckGo e Wikipedia. Pergunte sobre qualquer termo técnico ou moeda!
                </div>
                <div id="initial-options" class="mt-4 flex flex-wrap gap-2"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" autocomplete="off" 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/50 transition-all placeholder-slate-500"
                placeholder="Ex: 'O que é Cardano?' ou 'Quem é Satoshi?'">
            <button type="submit" id="send-btn" class="bg-orange-600 p-3.5 rounded-xl hover:bg-orange-500 transition-all active:scale-90 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </form>
    </footer>

    <script>
        const BOT_DATA = {
            options: [
                { id: "btc", label: "Bitcoin", key: "bitcoin" },
                { id: "eth", label: "Ethereum", key: "ethereum" },
                { id: "web3", label: "O que é Web3?", key: "web3" }
            ],
            responses: {
                "bitcoin": ["O Bitcoin é a primeira criptomoeda do mundo, servindo como ouro digital."],
                "ethereum": ["O Ethereum é uma blockchain para contratos inteligentes e dApps."],
                "web3": ["Web3 é a nova fase da internet, focada em descentralização e propriedade do usuário."]
            },
            fallbacks: [
                "Não encontrei isso nos meus dados locais nem na Wikipedia. Tente reformular!",
                "Infelizmente a busca externa não retornou resultados claros sobre isso.",
                "Pode tentar usar apenas o nome da moeda ou termo? (ex: 'Cardano')"
            ]
        };

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');
        const initialOptions = document.getElementById('initial-options');

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function appendMessage(role, text, isPending = false) {
            const isBot = role === 'bot';
            const div = document.createElement('div');
            div.className = `flex ${isBot ? 'justify-start' : 'justify-end'} msg-appear mb-4`;
            if (isPending) div.id = 'pending-msg';
            
            div.innerHTML = `
                <div class="${isBot ? 'bg-slate-800 border border-slate-700' : 'bg-orange-600 text-white'} p-3.5 rounded-2xl max-w-[85%] text-sm">
                    <p class="text-[9px] font-black uppercase opacity-50 mb-1 tracking-tighter">${isBot ? 'Assistente' : 'Tu'}</p>
                    <div class="content ${isPending ? 'loading-dots' : ''}">${text}</div>
                </div>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function fetchExternalInfo(query) {
            try {
                // API do DuckDuckGo (Abstract API)
                // Usamos JSONP através de script tag ou fetch se o CORS permitir
                const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&no_html=1&skip_disambig=1`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.AbstractText) {
                    return data.AbstractText;
                } else if (data.RelatedTopics && data.RelatedTopics.length > 0 && data.RelatedTopics[0].Text) {
                    return data.RelatedTopics[0].Text;
                }
                return null;
            } catch (error) {
                console.error("Erro na busca externa:", error);
                return null;
            }
        }

        async function handleInput(e) {
            if (e) e.preventDefault();
            const rawText = userInput.value.trim();
            if (!rawText) return;

            appendMessage('user', rawText);
            userInput.value = '';

            const pendingDiv = appendMessage('bot', 'A pesquisar', true);
            
            let response = null;
            const text = rawText.toLowerCase();

            // 1. Verificar Localmente Primeiro (Rápido)
            for (let key in BOT_DATA.responses) {
                if (text.includes(key)) {
                    response = getRandom(BOT_DATA.responses[key]);
                    break;
                }
            }

            // 2. Se não houver local, buscar no DuckDuckGo/Wikipedia
            if (!response) {
                response = await fetchExternalInfo(rawText);
            }

            // 3. Fallback final se tudo falhar
            if (!response) {
                response = getRandom(BOT_DATA.fallbacks);
            }

            // Remover estado de loading e mostrar resposta
            setTimeout(() => {
                pendingDiv.querySelector('.content').innerText = response;
                pendingDiv.querySelector('.content').classList.remove('loading-dots');
                pendingDiv.removeAttribute('id');
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 500);
        }

        function showOptions() {
            initialOptions.innerHTML = '';
            BOT_DATA.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn bg-slate-900/50 px-3 py-1.5 rounded-lg text-xs text-slate-300 hover:text-white";
                btn.innerText = opt.label;
                btn.onclick = () => {
                    userInput.value = opt.label;
                    handleInput();
                };
                initialOptions.appendChild(btn);
            });
        }

        showOptions();
        chatForm.onsubmit = handleInput;
    </script>
</body>
</html>
