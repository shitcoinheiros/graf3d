<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Especialista IA - Web Worker Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .dot-pulse { animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Interface -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-emerald-600 rounded-lg flex items-center justify-center font-bold">IA</div>
            <div>
                <h1 class="text-sm font-bold">Especialista Local</h1>
                <p id="status-text" class="text-[9px] text-slate-500 uppercase tracking-widest">A aguardar início...</p>
            </div>
        </div>
        <div id="status-dot" class="w-2 h-2 rounded-full bg-slate-700"></div>
    </header>

    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
        <!-- Mensagem Inicial -->
        <div id="setup-area" class="max-w-sm mx-auto mt-20 text-center">
            <h2 class="text-xl font-bold mb-4">Base de Dados Inteligente</h2>
            <p class="text-sm text-slate-400 mb-8">Esta IA será carregada no seu navegador e responderá com base no JSON configurado.</p>
            <button id="start-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 py-4 rounded-2xl font-bold transition-all active:scale-95 shadow-lg shadow-emerald-500/20">
                Ativar Motor Local
            </button>
            <div id="loader" class="hidden mt-6 space-y-2">
                <div class="flex justify-between text-[10px] text-emerald-400 font-bold uppercase">
                    <span>A descarregar motor...</span>
                    <span id="load-percent">0%</span>
                </div>
                <div class="h-1 bg-slate-800 rounded-full overflow-hidden">
                    <div id="load-bar" class="h-full bg-emerald-500 w-0 transition-all"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <div class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" disabled 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500/50 opacity-50 transition-all"
                placeholder="Carregue o motor primeiro...">
            <button id="send-btn" disabled class="bg-emerald-600 p-3 rounded-xl opacity-50 hover:bg-emerald-500 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </div>
    </footer>

    <!-- Scripts -->
    <script type="module">
        // 1. Definição do seu JSON de Conhecimento
        const CONHECIMENTO_JSON = {
            "loja": "Site do Utilizador",
            "especialidade": "Desenvolvimento Web Local",
            "faq": [
                {"pergunta": "Como funciona?", "resposta": "Eu utilizo Transformers.js para rodar diretamente no teu navegador."},
                {"pergunta": "É seguro?", "resposta": "Sim, os teus dados nunca saem do teu computador."}
            ]
        };

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const startBtn = document.getElementById('start-btn');
        const loader = document.getElementById('loader');
        const loadBar = document.getElementById('load-bar');
        const loadPercent = document.getElementById('load-percent');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        let worker;

        // Criar o código do Worker dinamicamente
        const workerCode = `
            import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
            
            env.allowLocalModels = false;
            let generator;

            self.onmessage = async (e) => {
                const { type, data } = e.data;

                if (type === 'load') {
                    generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                        progress_callback: (p) => self.postMessage({ type: 'progress', data: p })
                    });
                    self.postMessage({ type: 'ready' });
                }

                if (type === 'generate') {
                    const { prompt, config } = data;
                    const output = await generator(prompt, config);
                    self.postMessage({ type: 'result', data: output[0].generated_text });
                }
            };
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);

        function appendMessage(role, text) {
            const div = document.createElement('div');
            const isAi = role === 'ai';
            div.className = `flex ${isAi ? 'justify-start' : 'justify-end'} animate-in fade-in slide-in-from-bottom-2`;
            div.innerHTML = `
                <div class="${isAi ? 'bg-slate-800' : 'bg-emerald-600'} p-3 rounded-2xl max-w-[85%] text-sm shadow-md">
                    <p class="text-[9px] font-bold uppercase opacity-40 mb-1">${isAi ? 'IA' : 'Tu'}</p>
                    <div class="content">${text}</div>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div.querySelector('.content');
        }

        async function startIA() {
            startBtn.classList.add('hidden');
            loader.classList.remove('hidden');
            
            worker = new Worker(workerUrl, { type: 'module' });

            worker.onmessage = (e) => {
                const { type, data } = e.data;

                if (type === 'progress') {
                    if (data.status === 'progress') {
                        const p = Math.round(data.progress);
                        loadBar.style.width = p + '%';
                        loadPercent.innerText = p + '%';
                    }
                }

                if (type === 'ready') {
                    document.getElementById('setup-area').classList.add('hidden');
                    statusText.innerText = "Motor Pronto (Web Worker)";
                    statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]";
                    userInput.disabled = false;
                    userInput.classList.remove('opacity-50');
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-50');
                    appendMessage('ai', "Motor ativo em segundo plano. Podes perguntar qualquer coisa sobre o meu JSON!");
                }

                if (type === 'result') {
                    const aiDiv = chatBox.querySelector('.last-ai-msg');
                    const response = data.split('assistant\n').pop().replace('<|im_end|>', '').trim();
                    aiDiv.innerText = response;
                    aiDiv.classList.remove('last-ai-msg');
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            };

            worker.postMessage({ type: 'load' });
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            userInput.value = '';
            appendMessage('user', text);

            const aiContent = appendMessage('ai', '<span class="dot-pulse">A processar...</span>');
            aiContent.classList.add('last-ai-msg');

            const context = JSON.stringify(CONHECIMENTO_JSON);
            const prompt = `<|im_start|>system\nResponde em português usando estes dados: ${context}\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;

            worker.postMessage({ 
                type: 'generate', 
                data: { 
                    prompt, 
                    config: { max_new_tokens: 100, temperature: 0.3, do_sample: true } 
                } 
            });
        }

        startBtn.onclick = startIA;
        sendBtn.onclick = sendMessage;
        userInput.onkeypress = (e) => e.key === 'Enter' && sendMessage();
    </script>
</body>
</html>
