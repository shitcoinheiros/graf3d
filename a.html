<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Support - Dinâmico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .msg-appear { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn { transition: all 0.2s; border: 1px solid #334155; }
        .option-btn:hover { background: #f97316; border-color: #f97316; color: white; transform: scale(1.02); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center font-bold shadow-lg shadow-orange-900/20 text-white text-xl">₿</div>
            <div>
                <h1 class="text-sm font-bold leading-none text-white">CryptoBot <span class="text-orange-500 text-[10px]">V2</span></h1>
                <p class="text-[9px] text-emerald-500 uppercase tracking-widest mt-1 font-bold">● Respostas Inteligentes</p>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
        <div class="flex justify-start msg-appear">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl max-w-[85%] shadow-lg">
                <p class="text-[10px] font-black uppercase text-orange-500 mb-1">Assistente Virtual</p>
                <div class="text-sm leading-relaxed">
                    Olá! Sou o seu assistente especializado em Cripto. Como posso ajudar o seu portfólio hoje?
                </div>
                <div id="initial-options" class="mt-4 flex flex-wrap gap-2"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" autocomplete="off" 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/50 transition-all placeholder-slate-500"
                placeholder="Tente perguntar sobre 'Bitcoin' ou 'Segurança'...">
            <button type="submit" class="bg-orange-600 p-3.5 rounded-xl hover:bg-orange-500 transition-all active:scale-90 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </form>
    </footer>

    <script>
        // BASE DE DADOS EXPANDIDA
        const BOT_DATA = {
            options: [
                { id: "btc", label: "O que é Bitcoin?", key: "bitcoin" },
                { id: "seg", label: "Segurança", key: "seguranca" },
                { id: "tax", label: "Taxas", key: "taxa" }
            ],
            // Respostas com múltiplas variações (Sorteio Aleatório)
            responses: {
                "bitcoin": [
                    "O Bitcoin é a primeira moeda digital descentralizada, limitada a 21 milhões de unidades.",
                    "Pense no Bitcoin como 'ouro digital'. É uma reserva de valor protegida por criptografia.",
                    "O BTC é uma rede global de pagamentos que não depende de bancos centrais.",
                    "É a moeda líder do mercado, criada por Satoshi Nakamoto em 2009.",
                    "Bitcoin é um ativo escasso e digital que permite transações diretas entre pessoas."
                ],
                "seguranca": [
                    "A regra de ouro: 'Nem tuas chaves, nem teus bitcoins'. Use carteiras frias (Cold Wallets).",
                    "Proteja os seus ativos usando autenticação de dois fatores (2FA) e nunca partilhe a sua seed phrase.",
                    "Para valores altos, recomendamos dispositivos físicos como Ledger ou Trezor.",
                    "Mantenha as suas moedas fora de corretoras se não planeia fazer trading imediato.",
                    "Cuidado com phishing! Nunca clique em links suspeitos que prometem lucros fáceis."
                ],
                "taxa": [
                    "As taxas dependem do uso da rede. No Bitcoin chamam-se 'satoshis por byte'.",
                    "Redes como Solana têm taxas quase nulas, enquanto o Ethereum pode ser mais caro.",
                    "Para pagar menos taxas, tente enviar transações em horários de menor movimento.",
                    "As taxas servem para incentivar os validadores a processar a sua transação com segurança.",
                    "Lembre-se: transações com taxas muito baixas podem demorar mais tempo a serem confirmadas."
                ]
            },
            // 10 Formas de falar que não entendeu
            fallbacks: [
                "Ainda estou a aprender! Tente perguntar sobre 'Bitcoin' ou 'Segurança'.",
                "Não consegui processar isso. Que tal escolher uma das opções abaixo?",
                "Desculpe, o meu conhecimento foca-se em Cripto. Pode reformular a pergunta?",
                "Essa é difícil para mim! Tente usar palavras simples como 'comprar' ou 'carteira'.",
                "Hum, não encontrei nada sobre isso. Quer saber mais sobre 'Taxas'?",
                "O meu sistema não reconheceu esse termo. Use o menu de opções para facilitar!",
                "Estou confuso. Pode tentar perguntar de outra forma (ex: 'O que é Ethereum?')",
                "Ainda não tenho essa resposta. Que tal falarmos sobre segurança de ativos?",
                "Não entendi, mas posso ajudar com dúvidas sobre BTC, ETH ou Wallets!",
                "Lamento, o meu radar não captou isso. Tente palavras-chave isoladas."
            ]
        };

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');
        const initialOptions = document.getElementById('initial-options');

        function getRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function appendMessage(role, text) {
            const isBot = role === 'bot';
            const div = document.createElement('div');
            div.className = `flex ${isBot ? 'justify-start' : 'justify-end'} msg-appear mb-4`;
            
            div.innerHTML = `
                <div class="${isBot ? 'bg-slate-800 border border-slate-700' : 'bg-orange-600 text-white shadow-lg shadow-orange-900/20'} p-3.5 rounded-2xl max-w-[85%] text-sm">
                    <p class="text-[9px] font-black uppercase opacity-50 mb-1 tracking-tighter">${isBot ? 'Assistente' : 'Tu'}</p>
                    <div class="content">${text}</div>
                </div>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showOptions() {
            initialOptions.innerHTML = '';
            BOT_DATA.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn bg-slate-900/50 px-3 py-1.5 rounded-lg text-xs text-slate-300 hover:text-white";
                btn.innerText = opt.label;
                btn.onclick = () => {
                    appendMessage('user', opt.label);
                    setTimeout(() => appendMessage('bot', getRandom(BOT_DATA.responses[opt.key])), 300);
                };
                initialOptions.appendChild(btn);
            });
        }

        function handleInput(e) {
            e.preventDefault();
            const text = userInput.value.trim().toLowerCase();
            if (!text) return;

            appendMessage('user', userInput.value);
            userInput.value = '';

            let response = null;
            
            // Procura por palavras-chave
            for (let key in BOT_DATA.responses) {
                if (text.includes(key)) {
                    response = getRandom(BOT_DATA.responses[key]);
                    break;
                }
            }

            // Se não encontrou, usa um dos 10 fallbacks
            if (!response) {
                response = getRandom(BOT_DATA.fallbacks);
            }

            setTimeout(() => appendMessage('bot', response), 400);
        }

        showOptions();
        chatForm.onsubmit = handleInput;
    </script>
</body>
</html>
