<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoBot Ultra-Fast</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .msg-appear { animation: slideUp 0.2s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .cursor-blink { animation: blink 1s infinite; border-left: 2px solid #f97316; margin-left: 2px; }
        @keyframes blink { 50% { opacity: 0; } }
        .progress-glow { box-shadow: 0 0 10px rgba(249, 115, 22, 0.3); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center font-bold shadow-lg shadow-orange-900/20">₿</div>
            <div>
                <h1 class="text-sm font-bold leading-none text-white">CryptoBot <span class="text-orange-500 text-[10px]">FIX</span></h1>
                <p id="status-text" class="text-[9px] text-slate-500 uppercase tracking-widest mt-1">Standby</p>
            </div>
        </div>
        <div id="status-dot" class="w-2 h-2 rounded-full bg-slate-700"></div>
    </header>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-950">
        <div id="setup-area" class="max-w-sm mx-auto mt-16 text-center">
            <h2 class="text-xl font-bold mb-2">Motor de Resposta</h2>
            <p class="text-xs text-slate-400 mb-8 leading-relaxed">Corrigimos o erro de acesso aos ficheiros. <br>A primeira inicialização prepara o cache do seu navegador.</p>
            
            <button id="start-btn" class="w-full bg-orange-600 hover:bg-orange-500 py-4 rounded-2xl font-bold transition-all active:scale-95 shadow-lg shadow-orange-500/20">
                Iniciar Conexão Segura
            </button>

            <div id="loader" class="hidden mt-8 space-y-3">
                <div class="flex justify-between text-[10px] text-orange-400 font-black uppercase tracking-widest">
                    <span id="loader-label">A estabelecer túnel...</span>
                    <span id="load-percent">0%</span>
                </div>
                <div class="h-1.5 bg-slate-800 rounded-full overflow-hidden progress-glow">
                    <div id="load-bar" class="h-full bg-orange-500 w-0 transition-all duration-300"></div>
                </div>
                <p id="detailed-status" class="text-[9px] text-slate-500 italic mt-2">A aguardar resposta do servidor de modelos...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="p-4 bg-slate-900/50 border-t border-slate-800">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" autocomplete="off" disabled 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/50 opacity-50 transition-all"
                placeholder="Aguarde a ativação...">
            <button type="submit" id="send-btn" disabled class="bg-orange-600 p-3.5 rounded-xl opacity-50 hover:bg-orange-500 transition-all active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </form>
    </footer>

    <script type="module">
        const CONHECIMENTO_CRYPTO = {
            "tema": "Criptomoedas",
            "info": "Bitcoin é ouro digital. Ethereum é para contratos. Solana é rápida. Guarde em carteiras frias."
        };

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');
        const sendBtn = document.getElementById('send-btn');
        const startBtn = document.getElementById('start-btn');
        const loader = document.getElementById('loader');
        const loadBar = document.getElementById('load-bar');
        const loadPercent = document.getElementById('load-percent');
        const loaderLabel = document.getElementById('loader-label');
        const detailedStatus = document.getElementById('detailed-status');
        const statusText = document.getElementById('status-text');
        const statusDot = document.getElementById('status-dot');

        let worker;

        // WORKER COM BYPASS DE SEGURANÇA E FALLBACK
        const workerCode = `
            import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
            
            // Configurações para evitar erros de CORS/Unauthorized
            env.allowLocalModels = false;
            env.useBrowserCache = true;
            env.remoteHost = 'https://huggingface.co/';
            env.remotePathTemplate = '{model}/resolve/{revision}/';

            let generator;

            self.onmessage = async (e) => {
                const { type, data } = e.data;
                
                if (type === 'load') {
                    try {
                        // Usando o Qwen 0.5B que é extremamente estável nas rotas do HuggingFace
                        generator = await pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                            progress_callback: (p) => self.postMessage({ type: 'progress', data: p })
                        });
                        self.postMessage({ type: 'ready' });
                    } catch (err) {
                        self.postMessage({ type: 'error', data: err.message });
                    }
                }

                if (type === 'generate') {
                    try {
                        await generator(data.prompt, {
                            ...data.config,
                            callback_function: (beams) => {
                                const decoded = generator.tokenizer.decode([beams[0].output_token_ids.at(-1)]);
                                self.postMessage({ type: 'token', data: decoded });
                            }
                        });
                        self.postMessage({ type: 'result-end' });
                    } catch (err) {
                        self.postMessage({ type: 'error', data: err.message });
                    }
                }
            };
        `;

        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);

        function appendMessage(role, text = "") {
            const div = document.createElement('div');
            const isAi = role === 'ai';
            div.className = `flex ${isAi ? 'justify-start' : 'justify-end'} msg-appear`;
            div.innerHTML = `
                <div class="${isAi ? 'bg-slate-800 border border-slate-700' : 'bg-orange-600 text-white'} p-3.5 rounded-2xl max-w-[85%] text-sm shadow-md">
                    <p class="text-[9px] font-black uppercase opacity-50 mb-1 tracking-tighter">${isAi ? 'Consultor' : 'Tu'}</p>
                    <div class="content whitespace-pre-wrap">${text}</div>
                </div>
            `;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div.querySelector('.content');
        }

        async function startIA() {
            startBtn.classList.add('hidden');
            loader.classList.remove('hidden');
            statusText.innerText = "A ligar...";
            
            worker = new Worker(workerUrl, { type: 'module' });

            worker.onmessage = (e) => {
                const { type, data } = e.data;

                if (type === 'progress') {
                    if (data.status === 'progress') {
                        const p = Math.round(data.progress);
                        loadBar.style.width = p + '%';
                        loadPercent.innerText = p + '%';
                        detailedStatus.innerText = "A carregar " + data.file + "...";
                    }
                }

                if (type === 'ready') {
                    document.getElementById('setup-area').classList.add('hidden');
                    statusText.innerText = "Online";
                    statusDot.className = "w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981]";
                    userInput.disabled = false;
                    userInput.classList.remove('opacity-50');
                    sendBtn.disabled = false;
                    sendBtn.classList.remove('opacity-50');
                    appendMessage('ai', "Olá! O motor foi carregado com sucesso através da rota de segurança. Como posso ajudar hoje?");
                }

                if (type === 'token') {
                    const currentAi = document.querySelector('.streaming-msg');
                    if (currentAi) {
                        currentAi.innerHTML = currentAi.innerHTML.replace('<span class="cursor-blink"></span>', '') + data + '<span class="cursor-blink"></span>';
                        chatBox.scrollTop = chatBox.scrollHeight;
                    }
                }

                if (type === 'result-end') {
                    const currentAi = document.querySelector('.streaming-msg');
                    if (currentAi) {
                        currentAi.innerHTML = currentAi.innerHTML.replace('<span class="cursor-blink"></span>', '');
                        currentAi.classList.remove('streaming-msg');
                    }
                }

                if (type === 'error') {
                    detailedStatus.innerText = "Erro detetado. Tente mudar de rede ou desativar VPNs.";
                    appendMessage('ai', "Erro Crítico: " + data);
                }
            };

            worker.postMessage({ type: 'load' });
        }

        chatForm.onsubmit = (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text || userInput.disabled) return;

            userInput.value = ''; 
            appendMessage('user', text);

            const aiContent = appendMessage('ai', '<span class="cursor-blink"></span>');
            aiContent.classList.add('streaming-msg');

            const context = JSON.stringify(CONHECIMENTO_CRYPTO);
            const prompt = `<|im_start|>system\nÉs um especialista em Cripto. Dados: ${context}. Responde em português de Portugal.<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;

            worker.postMessage({ 
                type: 'generate', 
                data: { 
                    prompt, 
                    config: { max_new_tokens: 150, temperature: 0.1 } 
                } 
            });
        };

        startBtn.onclick = startIA;
    </script>
</body>
</html>
