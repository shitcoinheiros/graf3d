<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Support - Respostas Instantâneas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .msg-appear { animation: slideUp 0.3s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .option-btn { transition: all 0.2s; border: 1px solid #334155; }
        .option-btn:hover { background: #f97316; border-color: #f97316; color: white; transform: scale(1.02); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col font-sans overflow-hidden">

    <!-- Header -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md flex justify-between items-center z-10">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 bg-orange-500 rounded-lg flex items-center justify-center font-bold shadow-lg shadow-orange-900/20 text-white text-xl">₿</div>
            <div>
                <h1 class="text-sm font-bold leading-none text-white">CryptoBot <span class="text-orange-500 text-[10px]">SUPORTE</span></h1>
                <p class="text-[9px] text-emerald-500 uppercase tracking-widest mt-1 font-bold">● Online e Instantâneo</p>
            </div>
        </div>
    </header>

    <!-- Chat Area -->
    <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-slate-900 to-slate-950">
        <!-- Boas-vindas -->
        <div class="flex justify-start msg-appear">
            <div class="bg-slate-800 border border-slate-700 p-4 rounded-2xl max-w-[85%] shadow-lg">
                <p class="text-[10px] font-black uppercase text-orange-500 mb-1">Assistente Virtual</p>
                <div class="text-sm leading-relaxed">
                    Olá! Bem-vindo ao suporte especializado. Como posso ajudar com os seus investimentos hoje?
                </div>
                <div id="initial-options" class="mt-4 flex flex-wrap gap-2">
                    <!-- Gerado via JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Footer com Input para perguntas livres -->
    <footer class="p-4 bg-slate-900 border-t border-slate-800">
        <form id="chat-form" class="max-w-4xl mx-auto flex gap-2">
            <input type="text" id="user-input" autocomplete="off" 
                class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-3.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/50 transition-all placeholder-slate-500"
                placeholder="Escreva a sua dúvida ou escolha uma opção...">
            <button type="submit" class="bg-orange-600 p-3.5 rounded-xl hover:bg-orange-500 transition-all active:scale-90 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            </button>
        </form>
    </footer>

    <script>
        // BASE DE DADOS DE RESPOSTAS (FÁCIL DE EDITAR)
        const BOT_DATA = {
            options: [
                { id: "btc", label: "O que é o Bitcoin?", response: "O Bitcoin é a primeira criptomoeda descentralizada do mundo. Funciona como 'ouro digital' e tem um limite de 21 milhões de unidades." },
                { id: "seguranca", label: "Como guardar moedas?", response: "A forma mais segura é usar uma 'Cold Wallet' (carteira fria) como a Ledger ou Trezor, que mantém as tuas chaves privadas fora da internet." },
                { id: "taxas", label: "Taxas de Rede", response: "As taxas variam conforme o congestionamento da rede. A Solana é conhecida por taxas de cêntimos, enquanto o Ethereum pode ser mais caro em picos de uso." },
                { id: "ajuda", label: "Falar com Humano", response: "Para suporte personalizado, por favor envie um e-mail para suporte@exemplo.com ou ligue para o nosso número verde." }
            ],
            keywords: {
                "bitcoin": "O Bitcoin (BTC) é a moeda principal. Atualmente é vista como reserva de valor devido à sua escassez programada.",
                "ethereum": "O Ethereum (ETH) é uma rede para contratos inteligentes (Smart Contracts) e aplicações descentralizadas (dApps).",
                "carteira": "Existem Hot Wallets (apps no telemóvel) e Cold Wallets (dispositivos físicos). Para segurança máxima, use Cold Wallets.",
                "perda": "Se perdeu as suas palavras-passe (seed phrase), infelizmente não há como recuperar os fundos. Guarde-as sempre em papel!",
                "taxa": "As taxas (gas) servem para pagar aos mineiros/validadores que processam a sua transação na blockchain.",
                "comprar": "Pode comprar cripto em corretoras (Exchanges) como a Binance, Kraken ou Coinbase."
            },
            default: "Lamento, não entendi a sua pergunta. Tente usar palavras-chave como 'Bitcoin', 'Segurança' ou 'Taxas', ou escolha uma das opções acima."
        };

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const chatForm = document.getElementById('chat-form');
        const initialOptions = document.getElementById('initial-options');

        function appendMessage(role, text) {
            const isBot = role === 'bot';
            const div = document.createElement('div');
            div.className = `flex ${isBot ? 'justify-start' : 'justify-end'} msg-appear mb-4`;
            
            div.innerHTML = `
                <div class="${isBot ? 'bg-slate-800 border border-slate-700' : 'bg-orange-600 text-white shadow-lg shadow-orange-900/20'} p-3.5 rounded-2xl max-w-[85%] text-sm">
                    <p class="text-[9px] font-black uppercase opacity-50 mb-1 tracking-tighter">${isBot ? 'Assistente' : 'Tu'}</p>
                    <div class="content">${text}</div>
                </div>
            `;
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showOptions() {
            initialOptions.innerHTML = '';
            BOT_DATA.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "option-btn bg-slate-900/50 px-3 py-1.5 rounded-lg text-xs text-slate-300 hover:text-white";
                btn.innerText = opt.label;
                btn.onclick = () => {
                    appendMessage('user', opt.label);
                    setTimeout(() => appendMessage('bot', opt.response), 300);
                };
                initialOptions.appendChild(btn);
            });
        }

        function handleInput(e) {
            e.preventDefault();
            const text = userInput.value.trim().toLowerCase();
            if (!text) return;

            appendMessage('user', userInput.value);
            userInput.value = '';

            // Lógica de procura por palavras-chave
            let response = BOT_DATA.default;
            
            for (let key in BOT_DATA.keywords) {
                if (text.includes(key)) {
                    response = BOT_DATA.keywords[key];
                    break;
                }
            }

            setTimeout(() => appendMessage('bot', response), 400);
        }

        // Inicialização
        showOptions();
        chatForm.onsubmit = handleInput;
    </script>
</body>
</html>
