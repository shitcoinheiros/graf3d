<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ChatGPT - Crypto Analyst</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: #f7f7f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .logo {
            background: #10a37f;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: white;
        }

        .title {
            color: #2c2d35;
            font-weight: 500;
            font-size: 15px;
        }

        /* Container do chat com altura fixa e rolagem */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: #f7f7f8;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            scroll-behavior: smooth;
        }

        /* Mensagens */
        .message {
            margin-bottom: 20px;
            display: flex;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 85%;
            padding: 10px 14px;
            font-size: 15px;
            line-height: 1.5;
            border-radius: 20px;
            word-wrap: break-word;
        }

        .user .bubble {
            background: #10a37f;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .assistant .bubble {
            background: transparent;
            color: #2c2d35;
            padding: 0;
            max-width: 100%;
        }

        /* Conteúdo do assistente */
        .assistant-content {
            font-size: 15px;
            line-height: 1.6;
            color: #2c2d35;
        }

        .assistant-content p {
            margin-bottom: 12px;
        }

        .assistant-content pre {
            background: #f1f1f1;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .assistant-content code {
            background: #f1f1f1;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 13px;
        }

        /* Indicador de digitação */
        .typing-indicator {
            display: inline-flex;
            gap: 6px;
            padding: 8px 12px;
            background: #f1f1f1;
            border-radius: 20px;
            align-items: center;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: #9ca3af;
            border-radius: 50%;
            animation: pulse 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Input fixo na parte inferior */
        .input-area {
            background: #ffffff;
            border-top: 1px solid #e5e5e5;
            padding: 12px;
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 100%;
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 28px;
            display: flex;
            align-items: center;
            padding: 6px 6px 6px 16px;
            gap: 8px;
        }

        .input-wrapper input {
            flex: 1;
            border: none;
            padding: 10px 0;
            font-size: 15px;
            outline: none;
            background: transparent;
        }

        .input-wrapper button {
            background: #10a37f;
            border: none;
            border-radius: 28px;
            padding: 8px 20px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
        }

        .input-wrapper button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #e5e5e5;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        /* Ajuste para telas maiores */
        @media (min-width: 768px) {
            .chat-messages {
                max-width: 800px;
                margin: 0 auto;
                width: 100%;
            }
            
            .input-wrapper {
                max-width: 800px;
                margin: 0 auto;
            }
        }

        /* Ajuste para safe area no mobile */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .input-area {
                padding-bottom: max(12px, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">✦</div>
        <div class="title">ChatGPT · Crypto Analyst</div>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant">
                <div class="bubble">
                    <div class="assistant-content">
                        <p>Olá! 👋 Sou um assistente especializado em análise de criptomoedas para trades de 24 horas.</p>
                        <p>📌 <strong>Basta perguntar:</strong> “Que moeda devo comprar hoje?” — e vou analisar todas as trending coins e te dar a melhor recomendação.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="Digite sua pergunta..." onkeypress="handleKeyPress(event)" autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        // Elementos
        const messagesDiv = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // APIs
        const COINGECKO_API = 'https://api.coingecko.com/api/v3';
        const BINANCE_API = 'https://api.binance.com/api/v3';

        function addMessage(content, isUser = false, isHtml = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'assistant'}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (isHtml && typeof content === 'string') {
                const contentDiv = document.createElement('div');
                contentDiv.className = 'assistant-content';
                contentDiv.innerHTML = content;
                bubble.appendChild(contentDiv);
            } else if (isUser) {
                bubble.textContent = content;
            } else {
                const contentDiv = document.createElement('div');
                contentDiv.className = 'assistant-content';
                contentDiv.innerHTML = content;
                bubble.appendChild(contentDiv);
            }
            
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            scrollToBottom();
        }

        async function addTypingMessage() {
            return new Promise((resolve) => {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message assistant';
                messageDiv.id = 'typingMessage';
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                bubble.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div><span style="margin-left: 8px; color: #6b7280;">Analisando mercado...</span></div>';
                messageDiv.appendChild(bubble);
                messagesDiv.appendChild(messageDiv);
                scrollToBottom();
                resolve();
            });
        }

        function removeTypingMessage() {
            const typing = document.getElementById('typingMessage');
            if (typing) typing.remove();
        }

        async function addMessageWithTyping(content) {
            removeTypingMessage();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const contentDiv = document.createElement('div');
            contentDiv.className = 'assistant-content';
            bubble.appendChild(contentDiv);
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            
            // Efeito de digitação
            let i = 0;
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            const plainText = tempDiv.innerText;
            contentDiv.innerHTML = '';
            
            function type() {
                if (i < plainText.length) {
                    let text = plainText.substring(0, i + 1);
                    text = text.replace(/\n/g, '<br>');
                    contentDiv.innerHTML = text;
                    i++;
                    scrollToBottom();
                    setTimeout(type, 8 + Math.random() * 6);
                } else {
                    contentDiv.innerHTML = content;
                    scrollToBottom();
                }
            }
            type();
        }

        function scrollToBottom() {
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function formatPrice(p) {
            if (!p) return 'N/A';
            if (p < 0.01) return p.toFixed(6);
            if (p < 1) return p.toFixed(4);
            if (p < 1000) return p.toFixed(2);
            return p.toFixed(0);
        }

        async function getBollingerBands(symbol) {
            try {
                const res = await fetch(`${BINANCE_API}/klines?symbol=${symbol}USDT&interval=1h&limit=13`);
                if (!res.ok) return null;
                const data = await res.json();
                const prices = data.slice(0, 12).map(c => parseFloat(c[4]));
                const currentPrice = parseFloat(data[12][4]);
                const sma12 = prices.reduce((a, b) => a + b, 0) / prices.length;
                const variance = prices.reduce((acc, p) => acc + Math.pow(p - sma12, 2), 0) / prices.length;
                const stdDev = Math.sqrt(variance);
                const upperBand = sma12 + (stdDev * 2);
                const lowerBand = sma12 - (stdDev * 2);
                let bandPercent = (currentPrice - lowerBand) / (upperBand - lowerBand) * 100;
                bandPercent = Math.min(100, Math.max(0, bandPercent));
                return { sma12, upperBand, lowerBand, currentPrice, bandPercent };
            } catch (e) { return null; }
        }

        async function getTrendingCoins() {
            try {
                const res = await fetch(`${COINGECKO_API}/search/trending`);
                const data = await res.json();
                return data.coins.map(c => ({
                    name: c.item.name,
                    symbol: c.item.symbol.toUpperCase(),
                    score: c.item.score,
                    rank: c.item.market_cap_rank
                }));
            } catch (e) { return []; }
        }

        async function getBinanceData() {
            try {
                const res = await fetch(`${BINANCE_API}/ticker/24hr`);
                const all = await res.json();
                return all.filter(t => t.symbol.endsWith('USDT') && parseFloat(t.quoteVolume) > 2000000)
                    .map(t => ({
                        symbol: t.symbol.replace('USDT', ''),
                        price: parseFloat(t.lastPrice),
                        change: parseFloat(t.priceChangePercent),
                        volume: parseFloat(t.quoteVolume)
                    }));
            } catch (e) { return []; }
        }

        function calculateScore(coin, bollinger, binInfo, trendScore) {
            let total = 0;
            const factors = [];
            
            // Bollinger (35%)
            if (bollinger) {
                const bp = bollinger.bandPercent;
                if (bp >= 50 && bp <= 70) { total += 35; factors.push(`Bollinger: ${bp.toFixed(1)}% (35 pts) - ideal`); }
                else if (bp >= 45 && bp < 50) { total += 25; factors.push(`Bollinger: ${bp.toFixed(1)}% (25 pts) - próximo média`); }
                else if (bp > 70 && bp <= 80) { total += 20; factors.push(`Bollinger: ${bp.toFixed(1)}% (20 pts) - acima média`); }
                else if (bp > 80) { total += 10; factors.push(`Bollinger: ${bp.toFixed(1)}% (10 pts) - sobrecompra`); }
                else { total += 15; factors.push(`Bollinger: ${bp.toFixed(1)}% (15 pts)`); }
            } else { total += 20; factors.push(`Bollinger: dados limitados (20 pts)`); }
            
            // Valorização (25%)
            if (binInfo) {
                const g = binInfo.change;
                if (g > 0 && g <= 5) { total += 25; factors.push(`Valorização: +${g.toFixed(2)}% (25 pts) - saudável`); }
                else if (g > 5 && g <= 15) { total += 22; factors.push(`Valorização: +${g.toFixed(2)}% (22 pts) - bom momentum`); }
                else if (g > 15 && g <= 30) { total += 15; factors.push(`Valorização: +${g.toFixed(2)}% (15 pts) - acelerado`); }
                else if (g > 30) { total += 8; factors.push(`Valorização: +${g.toFixed(2)}% (8 pts) - pico extremo`); }
                else if (g < 0 && g >= -5) { total += 12; factors.push(`Valorização: ${g.toFixed(2)}% (12 pts) - correção`); }
                else { total += 5; factors.push(`Valorização: ${g.toFixed(2)}% (5 pts) - queda forte`); }
            } else { total += 15; factors.push(`Valorização: indisponível (15 pts)`); }
            
            // Volume (20%)
            if (binInfo) {
                const volM = binInfo.volume / 1e6;
                if (volM > 50) { total += 20; factors.push(`Volume: $${volM.toFixed(0)}M (20 pts) - excepcional`); }
                else if (volM > 20) { total += 18; factors.push(`Volume: $${volM.toFixed(0)}M (18 pts) - muito alto`); }
                else if (volM > 10) { total += 15; factors.push(`Volume: $${volM.toFixed(0)}M (15 pts) - alto`); }
                else if (volM > 5) { total += 12; factors.push(`Volume: $${volM.toFixed(0)}M (12 pts) - médio`); }
                else { total += 5; factors.push(`Volume: $${volM.toFixed(0)}M (5 pts) - baixo`); }
            } else { total += 10; factors.push(`Volume: indisponível (10 pts)`); }
            
            // Popularidade (20%)
            let trendPts = trendScore ? Math.min(20, trendScore / 5) : 10;
            total += trendPts;
            factors.push(`Popularidade: ${trendScore || 'médio'} (${trendPts} pts)`);
            
            return { total: Math.min(100, total), factors };
        }

        function predictTarget(price, score) {
            let gain = 0;
            if (score >= 85) gain = 15 + Math.random() * 5;
            else if (score >= 75) gain = 10 + Math.random() * 5;
            else if (score >= 65) gain = 7 + Math.random() * 3;
            else if (score >= 55) gain = 4 + Math.random() * 3;
            else gain = 1 + Math.random() * 2;
            return { gain: gain.toFixed(1), target: price * (1 + gain / 100) };
        }

        async function findBestTrade() {
            await addTypingMessage();
            
            try {
                const [trending, binanceData] = await Promise.all([getTrendingCoins(), getBinanceData()]);
                
                const allCoins = [];
                for (const tc of trending) {
                    const binInfo = binanceData.find(b => b.symbol === tc.symbol);
                    if (!binInfo) continue;
                    const boll = await getBollingerBands(tc.symbol);
                    await new Promise(r => setTimeout(r, 50));
                    const scoreData = calculateScore(tc, boll, binInfo, tc.score);
                    const pred = predictTarget(binInfo.price, scoreData.total);
                    allCoins.push({ ...tc, price: binInfo.price, change: binInfo.change, volume: binInfo.volume, bollinger: boll, score: scoreData.total, factors: scoreData.factors, prediction: pred });
                }
                
                allCoins.sort((a, b) => b.score - a.score);
                const best = allCoins[0];
                const top5 = allCoins.slice(0, 5);
                removeTypingMessage();
                
                if (!best) {
                    addMessage("❌ Não foi possível obter dados. Tente novamente.", false);
                    return;
                }
                
                const bandPos = best.bollinger ? best.bollinger.bandPercent.toFixed(1) : 'N/A';
                const confidence = best.score >= 80 ? 'Muito Alto' : best.score >= 70 ? 'Alto' : best.score >= 60 ? 'Médio-Alto' : 'Médio';
                const factorsText = best.factors.map(f => `  • ${f}`).join('\n');
                const rankingText = top5.map((c, i) => `  ${i+1}. ${c.name} (${c.symbol}) - ${c.score.toFixed(0)} pts`).join('\n');
                const barLength = 20;
                const filled = Math.floor(best.score / 5);
                const progressBar = '█'.repeat(filled) + '░'.repeat(barLength - filled);
                
                const result = `
## 🏆 RECOMENDAÇÃO PRINCIPAL

**${best.name} (${best.symbol})** | Rank CoinGecko #${best.rank || 'N/A'}

---

### 📈 PROJEÇÃO 24H
\`\`\`
┌─────────────────────────────────┐
│  POTENCIAL: +${best.prediction.gain}%              │
│  Preço: $${formatPrice(best.price)}                 │
│  Alvo: $${formatPrice(best.prediction.target)}                │
└─────────────────────────────────┘
\`\`\`

### 📊 MÉTRICAS
| Item | Valor |
|------|-------|
| Valorização 24h | ${best.change >= 0 ? '+' : ''}${best.change?.toFixed(2)}% |
| Volume 24h | $${(best.volume / 1e6).toFixed(1)}M |
| IA Score | ${best.score.toFixed(0)}/100 |
| Bollinger | ${bandPos}% |

---

### 🔎 FATORES ANALISADOS
\`\`\`
${factorsText}
\`\`\`

**Confiança:** ${confidence}  
\`${progressBar}\` ${best.score.toFixed(0)}%

---

### 📋 TOP 5 OPORTUNIDADES
\`\`\`
${rankingText}
\`\`\`

### 📌 ESTRATÉGIA
- **Entrada:** $${formatPrice(best.price)}
- **Stop-loss:** $${(best.price * 0.95).toFixed(4)} (5%)
- **Take-profit:** $${formatPrice(best.prediction.target)}
- **Horizonte:** 24h

---

⚠️ Análise baseada em ${allCoins.length} moedas do Trending CoinGecko.
                `;
                
                await addMessageWithTyping(result);
                addMessage(`✅ Recomendo **${best.name}** com potencial de +${best.prediction.gain}% nas próximas 24h.`, false);
                
            } catch (err) {
                removeTypingMessage();
                addMessage(`❌ Erro: ${err.message}`, false);
            }
        }

        async function processQuestion(question) {
            const q = question.toLowerCase();
            if (q.includes('moeda') && (q.includes('comprar') || q.includes('investir') || q.includes('recomenda') || q.includes('qual'))) {
                await findBestTrade();
            } else if (q.includes('olá') || q.includes('oi')) {
                addMessage("Olá! 👋 Pergunte **\"Que moeda devo comprar hoje?\"** para análise completa.", false);
            } else {
                addMessage("Para análise de trade, pergunte: **\"Que moeda devo comprar hoje?\"**", false);
            }
        }

        async function sendMessage() {
            const msg = userInput.value.trim();
            if (!msg) return;
            addMessage(msg, true);
            userInput.value = '';
            sendBtn.disabled = true;
            await processQuestion(msg);
            sendBtn.disabled = false;
            userInput.focus();
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
