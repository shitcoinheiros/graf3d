<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CryptoAnalyst Pro - AI Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gpt-accent: #10a37f;
            --user-bubble: #007bff;
        }
        body { font-family: 'Inter', sans-serif; background-color: #f7f7f8; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .app-header { height: 60px; background: white; border-bottom: 1px solid #e5e5e5; padding: 0 1rem; display: flex; align-items: center; justify-content: space-between; z-index: 50; }
        #chat-container { flex: 1; overflow-y: auto; padding-bottom: 2rem; }
        .messages-list { padding: 1rem; max-width: 850px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .message-wrapper { display: flex; width: 100%; gap: 12px; }
        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.assistant .text-box { background: white; border: 1px solid #e5e5e5; border-radius: 18px 18px 18px 2px; }
        .message-wrapper.user .text-box { background: var(--user-bubble); color: white; border-radius: 18px 18px 2px 18px; }
        .text-box { padding: 12px 18px; max-width: 85%; line-height: 1.6; font-size: 15px; }
        .avatar { width: 32px; height: 32px; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: var(--gpt-accent); color: white; }
        .input-area { background: white; border-top: 1px solid #e5e5e5; padding: 1.5rem; }
        .input-container { max-width: 800px; margin: 0 auto; position: relative; }
        #user-input { width: 100%; padding: 14px 50px 14px 16px; border: 1px solid #e5e5e5; border-radius: 12px; outline: none; }
        #ai-status { position: fixed; top: 60px; left: 0; width: 0%; height: 2px; background: var(--gpt-accent); transition: width 0.3s; z-index: 100; }
        table { width: 100%; margin: 10px 0; font-size: 13px; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
        h2 { font-weight: 700; margin-top: 10px; }
    </style>
</head>
<body>

<div id="ai-status"></div>

<header class="app-header">
    <div class="flex items-center gap-2">
        <div class="bg-[#10a37f] text-white p-1 rounded">✦</div>
        <span class="font-semibold">CryptoAnalyst AI</span>
    </div>
    <div id="model-badge" class="text-[10px] bg-gray-100 px-2 py-1 rounded text-gray-500">CARREGANDO IA...</div>
</header>

<main id="chat-container">
    <div class="messages-list" id="messages-list">
        <div class="message-wrapper assistant">
            <div class="avatar">🤖</div>
            <div class="text-box">
                Sistema online. Agora estou equipado com **Transformers.js**!<br>
                Além de comandos, posso sentir o "humor" das suas frases.
            </div>
        </div>
    </div>
</main>

<div class="input-area">
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Digite um comando ou uma frase sobre o mercado..." autocomplete="off">
        <button id="send-btn" class="absolute right-2 top-1/2 -translate-y-1/2 bg-[#10a37f] text-white p-2 rounded-lg">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="18" width="18"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<script type="module">
    // IMPORTANDO IA TRANSFORMERS.JS
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    
    // Configurações para rodar local no browser
    env.allowLocalModels = false;

    let classifier;
    const statusLoader = document.getElementById('ai-status');
    const badge = document.getElementById('model-badge');

    // Inicializa a IA em segundo plano
    async function initAI() {
        try {
            classifier = await pipeline('sentiment-analysis', 'Xenova/distilbert-base-uncased-finetuned-sst-2-english', {
                progress_callback: (p) => {
                    if(p.status === 'progress') statusLoader.style.width = p.progress + '%';
                    if(p.status === 'ready') {
                        statusLoader.style.width = '0%';
                        badge.innerText = 'IA PRONTA (LOCAL)';
                        badge.classList.replace('text-gray-500', 'text-green-600');
                    }
                }
            });
        } catch (e) { badge.innerText = 'IA OFFLINE'; }
    }
    initAI();

    const messagesList = document.getElementById('messages-list');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');

    const BINANCE_API = 'https://api.binance.com/api/v3';
    const COINGECKO_API = 'https://api.coingecko.com/api/v3';

    // Algoritmo Levenshtein (Correção de erros)
    function getSimilarity(a, b) {
        const matrix = Array.from({ length: a.length + 1 }, (_, i) => [i]);
        for (let j = 1; j <= b.length; j++) matrix[0][j] = j;
        for (let i = 1; i <= a.length; i++) {
            for (let j = 1; j <= b.length; j++) {
                const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                matrix[i][j] = Math.min(matrix[i-1][j]+1, matrix[i][j-1]+1, matrix[i-1][j-1]+cost);
            }
        }
        return matrix[a.length][b.length];
    }

    function matchCommand(input, targets) {
        let best = { item: null, dist: 3 };
        targets.forEach(t => {
            const d = getSimilarity(input.toLowerCase(), t.toLowerCase());
            if (d < best.dist) best = { item: t, dist: d };
        });
        return best.item;
    }

    // Funções de UI
    function parseMarkdown(text) { return text.replace(/^## (.*$)/gim, '<h2>$1</h2>').replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>').replace(/\n/g, '<br>'); }
    function scrollToEnd() { chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' }); }

    function appendMessage(role, content, isLive = false) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${role}`;
        const id = isLive ? 'live-' + Date.now() : '';
        wrapper.innerHTML = (role === 'assistant' ? `<div class="avatar">🤖</div>` : '') + `<div class="text-box" id="${id}">${parseMarkdown(content)}</div>`;
        messagesList.appendChild(wrapper);
        scrollToEnd();
        return id ? document.getElementById(id) : null;
    }

    async function typeEffect(element, html) {
        element.innerHTML = "";
        const tempDiv = document.createElement('div'); tempDiv.innerHTML = html;
        const nodes = Array.from(tempDiv.childNodes);
        for (const node of nodes) {
            if (node.nodeType === Node.TEXT_NODE) {
                for (let char of node.textContent) {
                    element.innerHTML += char;
                    await new Promise(r => setTimeout(r, 5));
                }
            } else { element.appendChild(node.cloneNode(true)); }
        }
        scrollToEnd();
    }

    const Brain = {
        async analyzeSentiment(text) {
            if (!classifier) return null;
            const res = await classifier(text);
            return res[0]; // { label: 'POSITIVE/NEGATIVE', score: 0.99 }
        },

        async executeScan() {
            const el = appendMessage('assistant', 'Varrendo mercado...', true);
            const res = await fetch(`${COINGECKO_API}/search/trending`);
            const data = await res.json();
            await typeEffect(el, `Encontrei **${data.coins.length}** moedas em tendência. Use o ticker (ex: BTC) para análise técnica.`);
        },

        async executeSingle(symbol) {
            const el = appendMessage('assistant', `Analisando ${symbol}...`, true);
            try {
                const res = await fetch(`${BINANCE_API}/ticker/24hr?symbol=${symbol.toUpperCase()}USDT`);
                const d = await res.json();
                const report = `## ${symbol.toUpperCase()}\n- **Preço:** $${parseFloat(d.lastPrice)}\n- **Variação:** ${d.priceChangePercent}%\n- **Volume:** ${parseFloat(d.quoteVolume).toLocaleString()}`;
                typeEffect(el, parseMarkdown(report));
            } catch { typeEffect(el, "Erro ao buscar dados na Binance."); }
        }
    };

    async function handleInteraction() {
        const query = userInput.value.trim();
        if (!query) return;

        appendMessage('user', query);
        userInput.value = '';
        
        const words = query.toLowerCase().split(' ');
        const cmd = matchCommand(words[0], ['comprar', 'ajuda', 'scan']);
        const coinMatch = query.match(/\b([A-Z]{3,5})\b/i);

        if (cmd === 'comprar' || cmd === 'scan') {
            await Brain.executeScan();
        } else if (coinMatch) {
            await Brain.executeSingle(coinMatch[1]);
        } else {
            // Se não for comando, a IA analisa o SENTIMENTO da frase
            const el = appendMessage('assistant', 'Processando intenção...', true);
            const sentiment = await Brain.analyzeSentiment(query);
            
            if (sentiment) {
                const mood = sentiment.label === 'POSITIVE' ? 'otimista (Bullish) 🚀' : 'pessimista (Bearish) 📉';
                const score = (sentiment.score * 100).toFixed(0);
                await typeEffect(el, `Sua mensagem parece **${mood}** com ${score}% de confiança. Deseja que eu procure oportunidades de compra?`);
            } else {
                await typeEffect(el, "Não entendi o comando. Tente algo como 'Comprar' ou o nome de uma moeda.");
            }
        }
    }

    sendBtn.addEventListener('click', handleInteraction);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleInteraction(); });
</script>
</body>
</html>
