<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CryptoAnalyst Pro - Bollinger Strategy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --gpt-accent: #10a37f; --user-bubble: #007bff; }
        body { font-family: 'Inter', sans-serif; background-color: #f7f7f8; height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
        .app-header { height: 60px; background: white; border-bottom: 1px solid #e5e5e5; padding: 0 1rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
        .message-wrapper { display: flex; width: 100%; max-width: 850px; margin: 0 auto; gap: 12px; }
        .text-box { background: white; padding: 15px; border-radius: 18px 18px 18px 2px; border: 1px solid #e5e5e5; width: 100%; font-size: 14px; line-height: 1.5; }
        .chart-wrapper { position: relative; height: 200px; width: 100%; margin: 15px 0; background: #fff; border-radius: 12px; border: 1px solid #eee; padding: 10px; }
        .input-area { padding: 1rem; background: white; border-top: 1px solid #e5e5e5; }
        .input-container { max-width: 800px; margin: 0 auto; position: relative; }
        #user-input { width: 100%; padding: 12px 45px 12px 16px; border: 1px solid #e5e5e5; border-radius: 12px; outline: none; }
        #send-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--gpt-accent); color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .badge-buy { background: #10a37f; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .badge-sell { background: #ef4444; color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<header class="app-header">
    <div class="flex items-center gap-2">
        <div class="bg-[#10a37f] text-white w-8 h-8 rounded flex items-center justify-center font-bold">✦</div>
        <span class="font-semibold text-gray-800">CryptoAnalyst Pro</span>
    </div>
</header>

<main id="chat-container"></main>

<div class="input-area">
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Ex: BTC ou SOL" autocomplete="off">
        <button id="send-btn">➔</button>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function calculateBollinger(prices) {
        const period = prices.length;
        const mma = prices.reduce((a, b) => a + b, 0) / period;
        const rows = prices.map(p => Math.pow(p - mma, 2));
        const stdDev = Math.sqrt(rows.reduce((a, b) => a + b, 0) / period);
        return {
            upper: mma + (stdDev * 2),
            lower: mma - (stdDev * 2),
            middle: mma
        };
    }

    function renderBollingerChart(canvasId, prices, bb) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        const labels = prices.map((_, i) => i);
        
        // Criando arrays das bandas para o gráfico
        const upperBand = Array(prices.length).fill(bb.upper);
        const lowerBand = Array(prices.length).fill(bb.lower);
        const middleBand = Array(prices.length).fill(bb.middle);

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Preço', data: prices, borderColor: '#374151', borderWidth: 2, pointRadius: 0, z: 10 },
                    { label: 'Banda Sup', data: upperBand, borderColor: 'rgba(239, 68, 68, 0.3)', borderDash: [5, 5], pointRadius: 0, fill: false },
                    { label: 'Banda Inf', data: lowerBand, borderColor: 'rgba(16, 163, 127, 0.3)', borderDash: [5, 5], pointRadius: 0, fill: false },
                    { label: 'MMA', data: middleBand, borderColor: 'rgba(0, 123, 255, 0.2)', borderWidth: 1, pointRadius: 0, fill: false }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { display: false }, y: { position: 'right', ticks: { font: { size: 9 } } } }
            }
        });
    }

    async function analyze(coin) {
        const symbol = coin.toUpperCase() || "BTC";
        const wrapper = document.createElement('div');
        wrapper.className = "message-wrapper";
        chatContainer.appendChild(wrapper);

        try {
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}USDT&interval=1h&limit=20`);
            const data = await res.json();
            const prices = data.map(d => parseFloat(d[4]));
            const currentPrice = prices[prices.length - 1];
            
            const bb = calculateBollinger(prices);
            const chartId = `chart-${Date.now()}`;
            
            // Lógica de Dica de Trade
            let tradeSignal = "AGUARDAR";
            let signalColor = "text-gray-500";
            if (currentPrice <= bb.lower * 1.01) { tradeSignal = "COMPRA (BUY)"; signalColor = "text-green-600"; }
            else if (currentPrice >= bb.upper * 0.99) { tradeSignal = "VENDA (SELL)"; signalColor = "text-red-600"; }

            wrapper.innerHTML = `
                <div class="text-box">
                    <h2 class="font-bold text-lg mb-2">📊 Relatório ${symbol}/USDT</h2>
                    <div class="grid grid-cols-2 gap-2 mb-4 text-xs">
                        <div class="bg-gray-50 p-2 rounded"><strong>Preço:</strong> $${currentPrice.toLocaleString()}</div>
                        <div class="bg-gray-50 p-2 rounded"><strong>Sinal:</strong> <span class="${signalColor} font-bold">${tradeSignal}</span></div>
                    </div>
                    
                    <div class="chart-wrapper"><canvas id="${chartId}"></canvas></div>

                    <div class="space-y-2 mt-4 border-t pt-3">
                        <div class="flex justify-between"><span>🎯 Alvo (Take Profit):</span> <strong class="text-green-600">$${bb.upper.toFixed(2)}</strong></div>
                        <div class="flex justify-between"><span>🛒 Entrada Ideal:</span> <strong class="text-blue-600">$${bb.lower.toFixed(2)}</strong></div>
                        <div class="flex justify-between"><span>🛡️ Stop Loss:</span> <strong class="text-red-600">$${(bb.lower * 0.97).toFixed(2)}</strong></div>
                    </div>
                    <p class="text-[10px] text-gray-400 mt-3 italic">*Dica: O sinal de compra ocorre quando o preço toca a banda inferior com volume.*</p>
                </div>
            `;

            renderBollingerChart(chartId, prices, bb);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

        } catch (e) {
            wrapper.innerHTML = `<div class="text-box text-red-500">Moeda não encontrada ou erro de conexão.</div>`;
        }
    }

    sendBtn.onclick = () => {
        const val = userInput.value;
        if(val) { analyze(val); userInput.value = ""; }
    };
</script>
</body>
</html>
