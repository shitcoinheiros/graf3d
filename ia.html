<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CryptoAnalyst Pro - AI Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gpt-dark: #202123;
            --gpt-gray: #343541;
            --gpt-accent: #10a37f;
            --user-bubble: #007bff;
            --header-height: 60px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f8;
            color: #374151;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header {
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e5e5;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 50;
        }

        .gpt-badge {
            background: var(--gpt-accent);
            color: white;
            width: 32px; height: 32px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            padding-bottom: 2rem;
        }

        .messages-list {
            padding: 1rem;
            max-width: 850px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message-wrapper { display: flex; width: 100%; gap: 12px; }
        .message-wrapper.user { justify-content: flex-end; }
        
        .message-wrapper.user .text-box {
            background: var(--user-bubble);
            color: white;
            border-radius: 18px 18px 2px 18px;
        }

        .message-wrapper.assistant .text-box {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 18px 18px 18px 2px;
        }

        .avatar {
            width: 32px; height: 32px; border-radius: 4px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--gpt-accent); color: white;
        }

        .text-box {
            padding: 12px 18px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .input-area {
            background: white;
            border-top: 1px solid #e5e5e5;
            padding: 1.5rem;
        }

        .input-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        #user-input {
            width: 100%;
            padding: 14px 50px 14px 16px;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            outline: none;
            font-size: 16px;
            transition: border 0.2s;
        }

        #user-input:focus { border-color: var(--gpt-accent); }

        #send-btn {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: var(--gpt-accent); color: white;
            width: 34px; height: 34px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }

        .typing-dot { width: 4px; height: 4px; background: #8e8ea0; border-radius: 50%; animation: bounce 1.4s infinite; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
        
        table { width: 100%; margin: 10px 0; font-size: 13px; border-collapse: collapse; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #eee; }
        h2 { font-weight: 700; color: #111827; margin-top: 10px; }
    </style>
</head>
<body>

<header class="app-header">
    <div class="flex items-center gap-2">
        <div class="gpt-badge">✦</div>
        <span class="font-semibold text-gray-800">CryptoAnalyst Pro</span>
    </div>
    <div class="flex items-center gap-2 text-[11px] font-bold text-gray-400">
        <span class="w-2 h-2 rounded-full bg-green-500"></span> BINANCE LIVE
    </div>
</header>

<main id="chat-container">
    <div class="messages-list" id="messages-list">
        <div class="message-wrapper assistant">
            <div class="avatar">🤖</div>
            <div class="text-box">
                Olá! Sou seu analista técnico. <br>
                • Digite <strong>"Comprar"</strong> para varredura geral (CoinGecko).<br>
                • Digite o nome de uma moeda (ex: <strong>"Analisar BTC"</strong>) para checagem direta.<br>
                • Digite <strong>"Ajuda"</strong> para ver os parâmetros.
            </div>
        </div>
    </div>
</main>

<div class="input-area">
    <div class="input-container">
        <input type="text" id="user-input" placeholder="O que deseja analisar agora?" autocomplete="off">
        <button id="send-btn">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" height="18" width="18"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
        </button>
    </div>
</div>

<script>
    const messagesList = document.getElementById('messages-list');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');

    const BINANCE_API = 'https://api.binance.com/api/v3';
    const COINGECKO_API = 'https://api.coingecko.com/api/v3';

    // --- LÓGICA DE TRATAMENTO DE TEXTO ---
    function formatCurrency(val) { return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: val < 1 ? 4 : 2 }).format(val); }
    function parseMarkdown(text) { return text.replace(/^## (.*$)/gim, '<h2>$1</h2>').replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>').replace(/\n/g, '<br>'); }
    function scrollToEnd() { chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' }); }

    function appendMessage(role, content, isLive = false) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${role}`;
        const id = isLive ? 'live-' + Date.now() : '';
        wrapper.innerHTML = (role === 'assistant' ? `<div class="avatar">🤖</div>` : '') + `<div class="text-box" id="${id}">${parseMarkdown(content)}</div>`;
        messagesList.appendChild(wrapper);
        scrollToEnd();
        return id ? document.getElementById(id) : null;
    }

    async function typeEffect(element, html) {
        element.innerHTML = "";
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = html;
        const nodes = Array.from(tempDiv.childNodes);
        for (const node of nodes) {
            if (node.nodeType === Node.TEXT_NODE) {
                for (let char of node.textContent) {
                    element.innerHTML += char;
                    if (Math.random() > 0.8) scrollToEnd();
                    await new Promise(r => setTimeout(r, 5));
                }
            } else { element.appendChild(node.cloneNode(true)); }
        }
        scrollToEnd();
    }

    // --- CÁLCULOS TÉCNICOS ---
    async function fetchTechnicalData(symbol) {
        try {
            const pair = symbol.toUpperCase().endsWith('USDT') ? symbol.toUpperCase() : symbol.toUpperCase() + 'USDT';
            const [tickerRes, klinesRes] = await Promise.all([
                fetch(`${BINANCE_API}/ticker/24hr?symbol=${pair}`),
                fetch(`${BINANCE_API}/klines?symbol=${pair}&interval=1h&limit=20`)
            ]);
            
            const tick = await tickerRes.json();
            const klines = await klinesRes.json();
            const prices = klines.map(k => parseFloat(k[4]));
            
            const sma = prices.reduce((a, b) => a + b, 0) / 20;
            const variance = prices.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / 20;
            const stdDev = Math.sqrt(variance);
            
            const upperBand = sma + (2 * stdDev);
            const lowerBand = sma - (2 * stdDev);
            const lastPrice = prices[prices.length - 1];
            const bPercent = ((lastPrice - lowerBand) / (upperBand - lowerBand)) * 100;

            return {
                symbol: pair,
                price: lastPrice,
                change: parseFloat(tick.priceChangePercent),
                bPercent,
                sma,
                upper: upperBand,
                stop: sma * 0.95,
                vol: parseFloat(tick.quoteVolume),
                isValid: (bPercent >= 51 && bPercent <= 63 && parseFloat(tick.priceChangePercent) > 0)
            };
        } catch (e) { return null; }
    }

    // --- MAPEAMENTO DE INTENÇÕES ---
    const Brain = {
        async executeScan() {
            const liveEl = appendMessage('assistant', 'Iniciando varredura em tempo real...', true);
            try {
                const res = await fetch(`${COINGECKO_API}/search/trending`);
                const data = await res.json();
                const coins = data.coins.map(c => c.item.symbol);
                
                let best = null;
                for (let s of coins) {
                    const tech = await fetchTechnicalData(s);
                    if (tech && tech.isValid) {
                        if (!best || tech.vol > best.vol) best = tech;
                    }
                }

                if (!best) {
                    await typeEffect(liveEl, "Não encontrei nenhuma moeda no range de **51% a 63%** com alta positiva nas últimas 24h.");
                } else {
                    this.renderTrade(liveEl, best, "Oportunidade de Varredura");
                }
            } catch (e) { liveEl.innerHTML = "Erro ao conectar com APIs."; }
        },

        async executeSingle(symbol) {
            const liveEl = appendMessage('assistant', `Analisando par ${symbol}/USDT...`, true);
            const data = await fetchTechnicalData(symbol);
            
            if (!data) {
                await typeEffect(liveEl, `Não encontrei dados para **${symbol}**. Verifique se o ticker está correto na Binance.`);
                return;
            }

            const status = data.isValid ? "✅ DENTRO DA ESTRATÉGIA" : "⚠️ FORA DOS CRITÉRIOS";
            this.renderTrade(liveEl, data, `Análise: ${data.symbol}`, status);
        },

        renderTrade(el, d, title, status = "") {
            const report = `
## ${title}
${status ? `**Status:** ${status}\n` : ''}
- **🛒 ENTRADA:** ${formatCurrency(d.price)}
- **🎯 ALVO:** ${formatCurrency(d.upper)} (Banda Superior)
- **🛡️ STOP:** ${formatCurrency(d.stop)} (5% abaixo da Média)

**Dados Técnicos:**
| Indicador | Valor |
| :--- | :--- |
| **Posição Banda** | ${d.bPercent.toFixed(1)}% |
| **Média (SMA)** | ${formatCurrency(d.sma)} |
| **Variação 24h** | ${d.change > 0 ? '+' : ''}${d.change}% |

${d.isValid ? '🚀 Ativo em posição de ignição acima da média central.' : 'Reforce a análise: o ativo não está no range ideal de 51-63%.'}
            `;
            typeEffect(el, parseMarkdown(report));
        },

        showHelp() {
            const liveEl = appendMessage('assistant', '', true);
            typeEffect(liveEl, parseMarkdown(`## Comandos Disponíveis:
- **"Comprar" ou "Oportunidade":** Busca moedas em tendência que atendam à regra.
- **"[NOME DA MOEDA]":** Ex: "BTC", "Analisar SOL", "Preço ETH".
- **Parâmetros:** Compra (51%-63% da Banda), Alvo (Topo), Stop (5% abaixo da média).`));
        }
    };

    // --- CONTROLE DE INPUT ---
    async function handleInteraction() {
        const query = userInput.value.trim();
        if (!query || sendBtn.disabled) return;

        appendMessage('user', query);
        userInput.value = '';
        sendBtn.disabled = true;

        const lowQuery = query.toLowerCase();
        const coinMatch = query.match(/\b([A-Z]{3,5})\b/i);

        if (lowQuery.includes('ajuda') || lowQuery.includes('funciona')) {
            Brain.showHelp();
        } 
        else if (lowQuery.includes('comprar') || lowQuery.includes('oportunidade') || lowQuery.includes('qual')) {
            await Brain.executeScan();
        }
        else if (coinMatch) {
            await Brain.executeSingle(coinMatch[1]);
        }
        else {
            const el = appendMessage('assistant', '', true);
            await typeEffect(el, "Não entendi sua solicitação. Tente digitar o nome de uma moeda (ex: **BTC**) ou peça uma **varredura**.");
        }

        sendBtn.disabled = false;
        userInput.focus();
    }

    sendBtn.addEventListener('click', handleInteraction);
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleInteraction(); });
</script>

</body>
</html>
