<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChatGPT - Crypto Analyst Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gpt-accent: #10a37f;
            --user-bubble: #007bff;
            --header-height: 60px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f7f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-header {
            height: var(--header-height);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e5e5;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            background-color: #f7f7f8;
            display: flex;
            flex-direction: column;
        }

        .messages-list {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .message-wrapper { display: flex; width: 100%; max-width: 850px; margin: 0 auto; }
        .message-wrapper.user { justify-content: flex-end; }
        .message-wrapper.user .text-box {
            background: var(--user-bubble);
            color: white;
            padding: 12px 18px;
            border-radius: 18px 18px 2px 18px;
            max-width: 75%;
        }

        .message-wrapper.assistant { justify-content: flex-start; gap: 12px; }
        .message-wrapper.assistant .text-box {
            background: white;
            padding: 12px 18px;
            border-radius: 18px 18px 18px 2px;
            border: 1px solid #e5e5e5;
            width: 100%;
        }

        .chart-wrapper {
            position: relative;
            height: 250px;
            width: 100%;
            margin-top: 1rem;
            background: #fff;
            border-radius: 8px;
        }

        .input-area { padding: 1rem; background: #f7f7f8; }
        .input-container { max-width: 800px; margin: 0 auto; position: relative; background: white; border: 1px solid #e5e5e5; border-radius: 12px; }
        #user-input { width: 100%; padding: 14px 45px 14px 16px; border: none; border-radius: 12px; outline: none; }
        #send-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--gpt-accent); color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<header class="app-header">
    <div class="flex items-center gap-2">
        <div class="bg-[#10a37f] text-white w-8 h-8 rounded flex items-center justify-center font-bold">✦</div>
        <span class="font-semibold text-gray-800">CryptoAnalyst Custom</span>
    </div>
</header>

<main id="chat-container">
    <div class="messages-list" id="messages-list"></div>
</main>

<div class="input-area">
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Analisar moeda (ex: BTC)..." autocomplete="off">
        <button id="send-btn">➔</button>
    </div>
</div>

<script>
    const messagesList = document.getElementById('messages-list');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function formatCurrency(val) {
        return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(val);
    }

    function appendMessage(role, content) {
        const wrapper = document.createElement('div');
        wrapper.className = `message-wrapper ${role}`;
        wrapper.innerHTML = `
            ${role === 'assistant' ? '<div class="w-8 h-8 bg-[#10a37f] rounded flex-shrink-0 flex items-center justify-center text-white text-xs">🤖</div>' : ''}
            <div class="text-box">${content}</div>
        `;
        messagesList.appendChild(wrapper);
        document.getElementById('chat-container').scrollTo(0, messagesList.scrollHeight);
        return wrapper;
    }

    function createChart(canvasId, labels, dataPoints, color) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 200);
        gradient.addColorStop(0, color + '44');
        gradient.addColorStop(1, color + '00');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Preço (USDT)',
                    data: dataPoints,
                    borderColor: color,
                    borderWidth: 2,
                    fill: true,
                    backgroundColor: gradient,
                    tension: 0.4,
                    pointRadius: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { grid: { color: '#f0f0f0' }, ticks: { font: { size: 10 } } }
                }
            }
        });
    }

    async function handleAnalysis() {
        const val = userInput.value.trim().toUpperCase();
        if (!val) return;
        userInput.value = '';
        
        appendMessage('user', val);
        const msg = appendMessage('assistant', `Buscando dados de **${val}**...`);
        
        try {
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${val}USDT&interval=1h&limit=30`);
            const data = await res.json();
            
            const prices = data.map(d => parseFloat(d[4]));
            const labels = data.map(d => new Date(d[0]).getHours() + 'h');
            const lastPrice = prices[prices.length - 1];
            const isUp = prices[prices.length - 1] > prices[0];
            const color = isUp ? '#10a37f' : '#ef4444';
            const chartId = `chart-${Date.now()}`;

            msg.querySelector('.text-box').innerHTML = `
                <h2 class="font-bold text-lg">${val}/USDT</h2>
                <p class="text-2xl font-semibold">${formatCurrency(lastPrice)}</p>
                <div class="chart-wrapper"><canvas id="${chartId}"></canvas></div>
                <div class="mt-4 text-xs text-gray-500">Últimas 30 horas de negociação na Binance.</div>
            `;

            createChart(chartId, labels, prices, color);

        } catch (e) {
            msg.querySelector('.text-box').innerText = "Erro ao carregar ativo. Verifique o ticker (Ex: BTC, ETH).";
        }
    }

    sendBtn.onclick = handleAnalysis;
    userInput.onkeypress = (e) => e.key === 'Enter' && handleAnalysis();
</script>
</body>
</html>
