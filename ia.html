<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neural Trade Terminal v3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/brain.js"></script>
    <style>
        :root { --gpt-accent: #10a37f; --user-bubble: #007bff; }
        body { font-family: 'Inter', sans-serif; background-color: #0b0e11; color: #eaecef; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #chat-container { flex: 1; overflow-y: auto; padding: 1rem; scroll-behavior: smooth; }
        .messages-list { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        .text-box { padding: 16px; border-radius: 12px; font-size: 15px; line-height: 1.6; border: 1px solid #2b2f36; background: #1e2329; }
        .user .text-box { background: var(--user-bubble); border: none; margin-left: auto; color: white; }
        .trade-card { background: #2b2f36; border-radius: 12px; padding: 15px; margin-top: 10px; border-left: 4px solid #f0b90b; }
        .input-area { background: #181a20; border-top: 1px solid #2b2f36; padding: 1.5rem; }
        input { background: #2b2f36; border: 1px solid #474d57; color: white; border-radius: 10px; padding: 12px; width: 100%; outline: none; }
        input:focus { border-color: #f0b90b; }
        .status-bar { font-size: 10px; color: #848e9c; padding: 5px 20px; background: #181a20; border-bottom: 1px solid #2b2f36; }
    </style>
</head>
<body>

<div class="status-bar flex justify-between uppercase font-bold">
    <span>Neural Engine: Active</span>
    <span id="ai-status">Transformers.js Loading...</span>
</div>

<main id="chat-container">
    <div class="messages-list" id="messages-list">
        <div class="flex assistant">
            <div class="text-box">
                **Terminal On.** Meus modelos neurais foram recalibrados. <br>
                Agora tenho um motor de vocabulário para não ser repetitivo. O que vamos caçar hoje?
            </div>
        </div>
    </div>
</main>

<div class="input-area">
    <div class="max-w-[800px] mx-auto relative">
        <input type="text" id="user-input" placeholder="Ex: 'analise sol' ou 'comprar'">
        <button id="send-btn" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#f0b90b] font-bold">ENVIAR</button>
    </div>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    env.allowLocalModels = false;
    let sentimentPipe;

    // --- MOTOR DE VOCABULÁRIO (Aumentando a "humanidade") ---
    const VOCABULARY = {
        searching: [
            "Deixa eu dar uma olhada no fluxo dessa moeda...",
            "Consultando o livro de ofertas e as bandas de Bollinger agora mesmo.",
            "Processando dados técnicos... um segundo, estou conferindo a tendência.",
            "Analisando o volume e a pressão de compra para você."
        ],
        positive: [
            "Cara, o setup está bonito! Olha esses pontos de entrada:",
            "Encontrei uma estrutura de alta interessante aqui. Veja:",
            "Temos um sinal neural de força. Pode ser um bom scalp.",
            "O gráfico está gritando compra. Se liga nos alvos:"
        ],
        neutral: [
            "O mercado está meio morno para essa moeda. Mas aqui estão os níveis:",
            "Não vejo uma explosão agora, mas o preço está respeitando as zonas.",
            "Análise concluída. O risco/retorno está equilibrado.",
            "Técnico neutro, mas os pontos de trade curtos são esses:"
        ]
    };

    const getRandom = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // --- REDE NEURAL (Brain.js) ---
    const net = new brain.NeuralNetwork();
    net.train([
        { input: [0.55, 0.02], output: [1] }, // Alta Probabilidade
        { input: [0.30, -0.05], output: [0] } // Baixa
    ]);

    async function init() {
        sentimentPipe = await pipeline('sentiment-analysis', 'Xenova/distilbert-base-uncased-finetuned-sst-2-english');
        document.getElementById('ai-status').innerText = "🟢 SYSTEM ONLINE";
    }
    init();

    async function getTradeData(symbol) {
        const pair = symbol.toUpperCase() + 'USDT';
        try {
            const [tRes, kRes] = await Promise.all([
                fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${pair}`),
                fetch(`https://api.binance.com/api/v3/klines?symbol=${pair}&interval=1h&limit=20`)
            ]);
            const tick = await tRes.json();
            const klines = await kRes.json();
            const prices = klines.map(k => parseFloat(k[4]));
            const sma = prices.reduce((a, b) => a + b, 0) / 20;
            const stdDev = Math.sqrt(prices.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / 20);
            
            const lastPrice = prices[prices.length - 1];
            const upper = sma + (2 * stdDev);
            const lower = sma - (2 * stdDev);
            const score = net.run([(lastPrice - lower)/(upper - lower), parseFloat(tick.priceChangePercent)/100])[0];

            return { symbol, price: lastPrice, upper, lower, sma, score: score * 100 };
        } catch (e) { return null; }
    }

    async function handle() {
        const query = document.getElementById('user-input').value;
        if(!query) return;
        appendMsg('user', query);
        document.getElementById('user-input').value = '';

        const thinking = appendMsg('assistant', getRandom(VOCABULARY.searching));
        
        // Simulação de busca Trending se for "comprar"
        let targetSymbol = query.match(/[a-zA-Z]{3,5}/)[0]; 
        const data = await getTradeData(targetSymbol);

        if(data) {
            const intro = data.score > 60 ? getRandom(VOCABULARY.positive) : getRandom(VOCABULARY.neutral);
            const stop = data.price * 0.985; // Stop de 1.5%
            const target = data.upper;

            const html = `
                ${intro}
                <div class="trade-card">
                    <div class="text-[#f0b90b] font-bold mb-2">SINAL: ${data.symbol.toUpperCase()}/USDT</div>
                    <div class="grid grid-cols-2 gap-2 text-sm">
                        <span class="text-gray-400">Entrada:</span> <span class="text-white">$${data.price}</span>
                        <span class="text-green-400 font-bold">Alvo:</span> <span class="text-white">$${target.toFixed(4)}</span>
                        <span class="text-red-400 font-bold">Stop:</span> <span class="text-white">$${stop.toFixed(4)}</span>
                    </div>
                    <div class="mt-3 text-[10px] text-gray-500 uppercase">Confiança Neural: ${data.score.toFixed(1)}%</div>
                </div>
            `;
            updateMsg(thinking, html);
        } else {
            updateMsg(thinking, "Não consegui ler os dados dessa moeda. Certeza que o ticker está certo?");
        }
    }

    function appendMsg(role, text) {
        const div = document.createElement('div');
        div.className = `message-wrapper ${role} flex`;
        div.innerHTML = `<div class="text-box">${text}</div>`;
        document.getElementById('messages-list').appendChild(div);
        return div;
    }

    function updateMsg(el, html) {
        el.querySelector('.text-box').innerHTML = html;
        document.getElementById('chat-container').scrollTo(0, document.getElementById('chat-container').scrollHeight);
    }

    document.getElementById('send-btn').onclick = handle;
</script>
</body>
</html>
