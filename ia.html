<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CryptoAnalyst AI v2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --gpt-accent: #10a37f; }
        body { font-family: 'Inter', sans-serif; background-color: #f7f7f8; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        #chat-container { flex: 1; overflow-y: auto; padding: 1rem; }
        .messages-list { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
        .text-box { padding: 12px 16px; border-radius: 12px; max-width: 85%; font-size: 14px; line-height: 1.5; }
        .assistant .text-box { background: white; border: 1px solid #e5e5e5; }
        .user .text-box { background: #007bff; color: white; margin-left: auto; }
        .input-area { background: white; border-top: 1px solid #e5e5e5; padding: 1rem; }
        #ai-progress { position: fixed; top: 0; left: 0; height: 3px; background: var(--gpt-accent); width: 0%; transition: width 0.2s; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
    </style>
</head>
<body>

<div id="ai-progress"></div>

<header class="p-4 bg-white border-bottom flex justify-between items-center shadow-sm">
    <span class="font-bold text-gray-700">✦ AI Terminal Pro</span>
    <div id="status-label" class="text-[10px] font-bold text-gray-400">
        <span class="status-dot bg-yellow-400"></span> CARREGANDO MODELO...
    </div>
</header>

<main id="chat-container">
    <div class="messages-list" id="messages-list">
        <div class="flex gap-3 assistant">
            <div class="text-box">
                Pronto. Ajustei a mira. Digite um ticker como **BTC**, **ETH** ou **SOL**. <br>
                Se eu falhar na Binance, vou te avisar o motivo real.
            </div>
        </div>
    </div>
</main>

<div class="input-area">
    <div class="max-w-3xl mx-auto relative">
        <input type="text" id="user-input" placeholder="Digite BTC ou 'comprar'..." class="w-full p-3 pr-12 border rounded-xl outline-none focus:border-green-500">
        <button id="send-btn" class="absolute right-2 top-1/2 -translate-y-1/2 bg-green-600 text-white p-2 rounded-lg">🚀</button>
    </div>
</div>

<script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
    
    env.allowLocalModels = false;
    let classifier;

    // Inicialização da IA com modelo multilingue (mais leve para sentimento)
    async function initIA() {
        try {
            classifier = await pipeline('sentiment-analysis', 'Xenova/bert-base-multilingual-uncased-sentiment', {
                progress_callback: (p) => {
                    document.getElementById('ai-progress').style.width = (p.progress || 0) + '%';
                    if(p.status === 'ready') {
                        document.getElementById('status-label').innerHTML = '<span class="status-dot bg-green-500"></span> IA ATIVA';
                        document.getElementById('ai-progress').style.display = 'none';
                    }
                }
            });
        } catch (e) {
            document.getElementById('status-label').innerText = 'ERRO AO CARREGAR IA';
        }
    }
    initIA();

    const messagesList = document.getElementById('messages-list');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(role, text) {
        const div = document.createElement('div');
        div.className = `flex gap-3 ${role}`;
        div.innerHTML = `<div class="text-box">${text.replace(/\n/g, '<br>')}</div>`;
        messagesList.appendChild(div);
        document.getElementById('chat-container').scrollTo(0, messagesList.scrollHeight);
        return div;
    }

    async function getBinanceData(symbol) {
        const pair = symbol.toUpperCase().replace('USDT', '') + 'USDT';
        try {
            const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${pair}`);
            if (!response.ok) throw new Error();
            return await response.json();
        } catch (e) {
            return null;
        }
    }

    async function handle() {
        const text = userInput.value.trim();
        if (!text) return;
        
        appendMessage('user', text);
        userInput.value = '';

        // 1. Prioridade: É um Ticker de Moeda? (Ex: BTC, SOL, PEPE)
        const coinMatch = text.match(/^[a-zA-Z]{3,6}$/);
        
        if (coinMatch) {
            const data = await getBinanceData(text);
            if (data) {
                const variacao = parseFloat(data.priceChangePercent);
                const emoji = variacao >= 0 ? '📈' : '📉';
                appendMessage('assistant', `**${data.symbol}**\nPreço: $${parseFloat(data.lastPrice).toLocaleString()}\nVar: ${variacao}% ${emoji}\nVol: ${parseFloat(data.quoteVolume).toFixed(0)}`);
                return;
            }
        }

        // 2. É um comando conhecido? (Levenshtein simples aqui)
        if (text.toLowerCase().includes('compra') || text.toLowerCase().includes('scan')) {
            appendMessage('assistant', 'Buscando tendências no CoinGecko...');
            // ... lógica de scan aqui
            return;
        }

        // 3. Se não for nada disso, usa a IA para entender o "drama" do usuário
        if (classifier) {
            const result = await classifier(text);
            const sentiment = result[0].label; // O modelo multilingual usa estrelas ou labels
            const msg = sentiment.includes('5') || sentiment.includes('4') || sentiment.includes('POSITIVE') 
                ? "Parece que você está confiante. Quer analisar algum gráfico?" 
                : "Sinto uma tensão no mercado. Cuidado com o FOMO!";
            appendMessage('assistant', msg);
        } else {
            appendMessage('assistant', "Não entendi. Digite o nome de uma moeda (ex: BTC).");
        }
    }

    sendBtn.onclick = handle;
    userInput.onkeypress = (e) => e.key === 'Enter' && handle();
</script>
</body>
</html>
