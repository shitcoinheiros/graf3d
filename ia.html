<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CryptoAnalyst Pro - Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --gpt-accent: #10a37f; }
        body { font-family: 'Inter', sans-serif; background-color: #0d1117; color: #e6edf3; height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
        .app-header { height: 60px; background: #161b22; border-bottom: 1px solid #30363d; padding: 0 1rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 1.5rem; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 15px; width: 100%; max-width: 850px; margin: 0 auto; }
        .chart-container { height: 300px; width: 100%; margin: 15px 0; border-radius: 8px; overflow: hidden; border: 1px solid #30363d; }
        .input-area { padding: 1rem; background: #161b22; border-top: 1px solid #30363d; }
        .input-container { max-width: 800px; margin: 0 auto; position: relative; }
        #user-input { width: 100%; padding: 12px 45px 12px 16px; background: #0d1117; border: 1px solid #30363d; border-radius: 12px; outline: none; color: white; }
        #send-btn { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: var(--gpt-accent); color: white; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .status-pill { padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

<header class="app-header">
    <div class="flex items-center gap-2">
        <div class="bg-[#10a37f] text-white w-8 h-8 rounded flex items-center justify-center font-bold">✦</div>
        <span class="font-semibold">CryptoAnalyst Terminal</span>
    </div>
    <div id="trend-status" class="text-[10px] text-gray-400 animate-pulse">Scanning Trends...</div>
</header>

<main id="chat-container"></main>

<div class="input-area">
    <div class="input-container">
        <input type="text" id="user-input" placeholder="Digite uma moeda ou 'qual a boa?'" autocomplete="off">
        <button id="send-btn">➔</button>
    </div>
</div>

<script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Funções de Cálculo Técnico
    function calculateBB(data) {
        const period = 20;
        const closes = data.map(d => d.close);
        const sma = closes.reduce((a, b) => a + b, 0) / period;
        const variance = closes.reduce((a, b) => a + Math.pow(b - sma, 2), 0) / period;
        const stdDev = Math.sqrt(variance);
        return { upper: sma + (stdDev * 2), lower: sma - (stdDev * 2), middle: sma };
    }

    async function getTrendingCoin() {
        const res = await fetch('https://api.coingecko.com/api/v3/search/trending');
        const json = await res.json();
        return json.coins[0].item.symbol; // Retorna a top trending
    }

    async function createAnalysis(specificCoin = null) {
        let symbol = specificCoin ? specificCoin.toUpperCase() : null;
        if (!symbol || symbol === "QUAL" || symbol === "QUERO") {
            symbol = await getTrendingCoin();
        }

        const card = document.createElement('div');
        card.className = "card";
        chatContainer.appendChild(card);

        try {
            const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}USDT&interval=1h&limit=50`);
            const rawData = await res.json();
            
            const chartData = rawData.map(d => ({
                time: d[0] / 1000,
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4])
            }));

            const lastPrice = chartData[chartData.length - 1].close;
            const bb = calculateBB(chartData.slice(-20));
            
            // Definição de Sinais
            const isBuy = lastPrice <= bb.lower * 1.005;
            const isSell = lastPrice >= bb.upper * 0.995;
            const stopLoss = bb.lower * 0.97;

            card.innerHTML = `
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-xl font-bold">${symbol}/USDT</h2>
                        <p class="text-xs text-gray-400">Análise de Tendência (1H)</p>
                    </div>
                    <div class="text-right">
                        <span class="status-pill ${isBuy ? 'bg-green-900 text-green-300' : isSell ? 'bg-red-900 text-red-300' : 'bg-blue-900 text-blue-300'}">
                            ${isBuy ? 'OPORTUNIDADE DE COMPRA' : isSell ? 'ZONA DE EXAUSTÃO' : 'NEUTRO'}
                        </span>
                    </div>
                </div>
                
                <div id="chart-${symbol}" class="chart-container"></div>

                <div class="grid grid-cols-3 gap-2 mt-4">
                    <div class="bg-[#0d1117] p-3 rounded-lg border border-gray-800">
                        <p class="text-[10px] text-gray-500 uppercase">🎯 Alvo</p>
                        <p class="text-green-500 font-bold">$${bb.upper.toFixed(2)}</p>
                    </div>
                    <div class="bg-[#0d1117] p-3 rounded-lg border border-gray-800">
                        <p class="text-[10px] text-gray-500 uppercase">🛡️ Stop</p>
                        <p class="text-red-500 font-bold">$${stopLoss.toFixed(2)}</p>
                    </div>
                    <div class="bg-[#0d1117] p-3 rounded-lg border border-gray-800">
                        <p class="text-[10px] text-gray-500 uppercase">💰 Preço</p>
                        <p class="text-white font-bold">$${lastPrice.toFixed(2)}</p>
                    </div>
                </div>
            `;

            // Inicializando o Gráfico TradingView Lightweight
            const chart = LightweightCharts.createChart(document.getElementById(`chart-${symbol}`), {
                layout: { background: { color: '#161b22' }, textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#30363d' }, horzLines: { color: '#30363d' } },
                rightPriceScale: { borderVisible: false },
                timeScale: { borderVisible: false, timeVisible: true }
            });

            const candleSeries = chart.addCandlestickSeries({ upColor: '#10a37f', downColor: '#ef4444', borderVisible: false, wickUpColor: '#10a37f', wickDownColor: '#ef4444' });
            candleSeries.setData(chartData);

            // Adicionando as Bandas no Gráfico
            const upperLine = chart.addLineSeries({ color: '#ef4444', lineWidth: 1, lineStyle: 2, title: 'Upper' });
            const lowerLine = chart.addLineSeries({ color: '#10a37f', lineWidth: 1, lineStyle: 2, title: 'Lower' });
            
            upperLine.setData(chartData.map(d => ({ time: d.time, value: bb.upper })));
            lowerLine.setData(chartData.map(d => ({ time: d.time, value: bb.lower })));

            // Marcadores de Compra/Venda
            if (isBuy) {
                candleSeries.setMarkers([{ time: chartData[chartData.length - 1].time, position: 'belowBar', color: '#10a37f', shape: 'arrowUp', text: 'BUY' }]);
            } else if (isSell) {
                candleSeries.setMarkers([{ time: chartData[chartData.length - 1].time, position: 'aboveBar', color: '#ef4444', shape: 'arrowDown', text: 'SELL' }]);
            }

            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });

        } catch (e) {
            console.error(e);
            card.innerHTML = `<p class="text-red-500">Erro ao carregar dados de ${symbol}. Tente outra.</p>`;
        }
    }

    sendBtn.onclick = () => {
        const val = userInput.value;
        if(val) { createAnalysis(val); userInput.value = ""; }
    };
    userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendBtn.click(); });
</script>
</body>
</html>
